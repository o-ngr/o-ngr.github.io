<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<title>index</title>
<style>
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --ui: #1a1a1a;
    --accent: #dc2626;
    --glass: rgba(255,255,255,0.92);
  }
  html, body {
    margin: 0; padding: 0; height: 100%; background: var(--bg); overscroll-behavior: none;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap {
    position: fixed; inset: 0; display: grid; grid-template-rows: 1fr auto; gap: 0;
  }
  canvas#sim { width: 100%; height: 100%; display: block; background: #111827; }
  .hud {
    position: absolute; inset: 0; pointer-events: none;
  }

  .panel {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    width: min(92%, 460px);
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 16px 24px;
    background: var(--glass);
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    backdrop-filter: blur(8px);
    color: var(--ui);
    pointer-events: auto;
    box-sizing: border-box;
    z-index: 30;
  }

  .panel h1 { 
    margin: 0; 
    font-size: 16px; 
    font-weight: 700; 
    color: var(--accent); 
    letter-spacing: 0.05em; 
    text-align: center;
    border-bottom: 2px solid rgba(0,0,0,0.06);
    padding-bottom: 6px;
  }

  .stats-row {
    display: flex;
    justify-content: space-around;
    align-items: center;
    gap: 16px;
  }

  .stat-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
    background: rgba(0, 0, 0, 0.03);
    padding: 8px 12px;
    border-radius: 12px;
  }

  .stat-label {
    font-size: 12px;
    color: #666;
    font-weight: 600;
    margin-bottom: 2px;
  }

  .stat-val {
    font-size: 28px;
    font-weight: 800;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .stat-val.score-num { color: #111827; }
  .stat-val.miss-num { color: #ef4444; }
  .stat-sub { font-size: 14px; color: #888; font-weight: 600; }

  .progress-dots {
    display: flex; 
    justify-content: center;
    flex-wrap: wrap; 
    gap: 6px;
    margin-top: 2px;
  }
  .progress-dot {
    width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid #cbd5e1; background: #fff; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 900; line-height: 1; color: transparent;
    transition: transform 0.25s cubic-bezier(.34,1.56,.64,1), background-color 0.25s ease, border-color 0.25s ease, color 0.15s ease 0.1s;
  }
  .progress-dot.correct {
    background: var(--accent); border-color: var(--accent); color: #fff;
    transform: scale(1.15);
  }
  .progress-dot.correct::after { content: '○'; }
  .progress-dot.incorrect {
    background: #4b5563; border-color: #4b5563; color: #fff;
    transform: scale(1.15);
  }
  .progress-dot.incorrect::after { content: '✕'; }

  @supports(padding:max(0px)) {
    .panel { bottom: max(20px, env(safe-area-inset-bottom)); }
  }

  .overlay-screen {
    position: absolute; inset: 0; display: none; pointer-events: auto;
    background: rgba(0,0,0,0.7); flex-direction: column; align-items: center; justify-content: center;
    color: #fff; text-align: center; backdrop-filter: blur(2px);
    opacity: 0; transition: opacity 0.35s ease, backdrop-filter 0.35s ease;
  }
  .overlay-screen.show { opacity: 1; backdrop-filter: blur(6px); }
  .overlay-screen h2 { font-size: 36px; margin: 0 0 10px 0; transform: scale(0.85); transition: transform 0.4s cubic-bezier(.34,1.56,.64,1); }
  .overlay-screen.show h2 { transform: scale(1); }
  .overlay-screen p { font-size: 18px; margin: 0 0 20px 0; }

  #start-overlay {
    background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('startoverlay.jpg');
    background-size: 100% auto;
    background-position: center;
    background-repeat: no-repeat;
    z-index: 100;
  }
  #start-overlay h2, #start-overlay p {
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
  }

  #gameover-overlay h2 { 
    color: #ef4444; 
    font-size: clamp(48px, 9vw, 84px); 
    font-weight: 900;
    letter-spacing: 0.05em;
    text-shadow: 0 4px 20px rgba(239, 68, 68, 0.6), 0 2px 8px rgba(0, 0, 0, 0.9);
  }

  /* ――― ゲームクリア画面のインパクト強化デザイン ――― */
  #gameclear-overlay {
    background: radial-gradient(circle at center, rgba(16, 185, 129, 0.25) 0%, rgba(0, 0, 0, 0.85) 80%);
  }
  #gameclear-overlay h2 { 
    color: #4ade80; 
    font-size: clamp(52px, 10vw, 96px); 
    font-weight: 900;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-shadow: 0 0 30px rgba(74, 222, 128, 0.8), 0 0 60px rgba(34, 197, 94, 0.5), 0 4px 12px rgba(0, 0, 0, 0.9);
    animation: clearZoomPulse 1.8s ease-in-out infinite alternate;
    margin-bottom: 16px;
  }
  @keyframes clearZoomPulse {
    0% { transform: scale(0.95); text-shadow: 0 0 20px rgba(74, 222, 128, 0.6), 0 4px 12px rgba(0,0,0,0.9); }
    100% { transform: scale(1.05); text-shadow: 0 0 40px rgba(74, 222, 128, 1), 0 0 80px rgba(34, 197, 94, 0.8), 0 4px 12px rgba(0,0,0,0.9); }
  }
  #gameclear-overlay p {
    font-size: clamp(20px, 4vw, 28px);
    font-weight: 700;
    letter-spacing: 0.05em;
    color: #f3f4f6;
    text-shadow: 0 2px 10px rgba(0,0,0,0.9);
    margin-bottom: 32px;
  }
  #gameclear-overlay .btn-retry {
    padding: 16px 48px;
    font-size: 18px;
    background: linear-gradient(135deg, #22c55e, #16a34a);
    box-shadow: 0 6px 24px rgba(34, 197, 94, 0.5);
    border-radius: 30px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  #gameclear-overlay .btn-retry:hover {
    transform: scale(1.08);
    box-shadow: 0 8px 30px rgba(34, 197, 94, 0.8);
  }

  .question-panel {
    position: absolute; inset: 0;
    margin: auto;
    width: min(94%, 800px);
    height: min(85%, 520px);
    background: rgba(10, 15, 26, 0.82);
    border: 3px solid var(--accent);
    border-radius: 24px;
    padding: 24px 32px;
    color: #ffffff;
    display: none;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    pointer-events: auto;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    opacity: 0;
    transform: scale(0.92);
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    backdrop-filter: blur(12px);
    box-sizing: border-box;
    z-index: 50;
  }
  .question-panel.show { opacity: 1; transform: scale(1); }

  .question-panel.minimized {
    top: 14px;
    bottom: auto;
    left: 50%;
    right: auto;
    width: min(92%, 420px);
    height: auto;
    transform: translate(-50%, -20px) scale(0.85);
    background: var(--glass);
    color: var(--ui);
    border-width: 2px;
    padding: 12px 16px 14px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.25);
    opacity: 0;
    pointer-events: none;
  }
  .question-panel.minimized.show {
    opacity: 1;
    transform: translate(-50%, 0) scale(1);
  }

  .question-timer-row { width: 100%; display: flex; align-items: center; gap: 12px; }
  .question-timer-track { flex: 1; height: 10px; background: rgba(255,255,255,0.2); border-radius: 6px; overflow: hidden; }
  .minimized .question-timer-track { height: 7px; background: #e5e7eb; }
  .question-timer-fill { height: 100%; width: 100%; background: var(--accent); transition: width 0.08s linear; }
  .question-timer-num { font-variant-numeric: tabular-nums; font-size: 18px; font-weight: 700; color: #ff8080; min-width: 3em; text-align: right; }
  .minimized .question-timer-num { font-size: 13px; color: var(--accent); }
  .question-timer-fill.urgent, .question-timer-num.urgent { animation: timerUrgent 0.45s ease-in-out infinite; }
  @keyframes timerUrgent { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

  .question-text { 
    font-size: clamp(20px, 3.5vw, 32px); 
    font-weight: 700; 
    line-height: 1.5; 
    text-align: center; 
    letter-spacing: 0.03em;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1;
    word-break: break-word;
  }
  .minimized .question-text {
    font-size: 16px;
    color: var(--ui);
    text-shadow: none;
    flex: none;
  }

  .question-choices { display: flex; gap: 24px; justify-content: center; width: 100%; }
  .minimized .question-choices { gap: 16px; display: none; }
  
  .choice-btn { 
    cursor: pointer; 
    padding: 16px 28px; 
    border-radius: 16px; 
    text-align: center; 
    flex: 1;
    max-width: 220px;
    transition: transform 0.12s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
  }
  .minimized .choice-btn { padding: 8px 18px; border-radius: 10px; min-width: 100px; max-width: none; flex: none; box-shadow: none; }
  .choice-maru { background: #fee2e2; border: 3px solid var(--accent); }
  .choice-batsu { background: #f3f4f6; border: 3px solid #9ca3af; }
  .choice-mark { font-size: 42px; font-weight: bold; line-height: 1; margin-bottom: 4px; }
  .minimized .choice-mark { font-size: 30px; margin-bottom: 2px; }
  .choice-maru .choice-mark, .choice-maru .choice-label { color: #dc2626; font-weight: bold; }
  .choice-batsu .choice-mark, .choice-batsu .choice-label { color: #111827; font-weight: bold; }
  .choice-btn:hover { transform: translateY(-3px); }
  .choice-btn:active { transform: scale(0.94); }

  .side-timer-bar {
    position: absolute;
    top: 15%;
    bottom: 15%;
    width: 12px;
    background: rgba(255, 255, 255, 0.25);
    border: 2px solid rgba(255, 255, 255, 0.4);
    border-radius: 6px;
    overflow: hidden;
    backdrop-filter: blur(4px);
    display: none;
    z-index: 40;
    opacity: 0;
    transition: opacity 0.3s ease, transform 0.3s ease;
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
  }
  .side-timer-bar.left { left: 20px; }
  .side-timer-bar.right { right: 20px; }
  .side-timer-bar.show {
    display: block;
    opacity: 1;
  }
  .side-timer-bar.disappear {
    animation: sideTimerDisappear 0.4s forwards;
  }
  @keyframes sideTimerDisappear {
    0% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(0.8); }
  }
  .side-timer-fill {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 100%;
    background: var(--accent);
    transition: height 0.08s linear;
  }
  .side-timer-fill.urgent {
    animation: timerUrgent 0.45s ease-in-out infinite;
  }

  .center-choice-arrow {
    position: absolute;
    top: 50%;
    left: 50%;
    font-size: min(30vw, 220px);
    font-weight: 900;
    line-height: 1;
    opacity: 0;
    pointer-events: none;
    z-index: 55;
    transform: translate(-50%, -50%) scale(0.3);
    transition: opacity 0.4s ease, transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .center-choice-arrow.dir-left {
    color: #ff4d4d;
    filter: drop-shadow(0 0 18px rgba(255,77,77,0.85)) drop-shadow(0 6px 20px rgba(0,0,0,0.6));
  }
  .center-choice-arrow.dir-right {
    color: #e5e7eb;
    filter: drop-shadow(0 0 18px rgba(229,231,235,0.85)) drop-shadow(0 6px 20px rgba(0,0,0,0.6));
  }
  .center-choice-arrow.show.dir-left {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1) translateX(-16px);
  }
  .center-choice-arrow.show.dir-right {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1) translateX(16px);
  }
  .center-choice-arrow.pulse.dir-left {
    animation: centerArrowPulseLeft 0.9s ease-in-out infinite;
  }
  .center-choice-arrow.pulse.dir-right {
    animation: centerArrowPulseRight 0.9s ease-in-out infinite;
  }
  @keyframes centerArrowPulseLeft {
    0%, 100% { transform: translate(-50%, -50%) scale(1) translateX(-16px); }
    50%      { transform: translate(-50%, -50%) scale(1.1) translateX(-20px); }
  }
  @keyframes centerArrowPulseRight {
    0%, 100% { transform: translate(-50%, -50%) scale(1) translateX(16px); }
    50%      { transform: translate(-50%, -50%) scale(1.1) translateX(20px); }
  }
  .center-choice-arrow.exit.dir-left {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.85) translateX(-140px);
  }
  .center-choice-arrow.exit.dir-right {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.85) translateX(140px);
  }

  .score-pop { display: inline-block; animation: scorePop 0.35s ease; }
  @keyframes scorePop {
    0% { transform: scale(1); }
    35% { transform: scale(1.4); color: var(--accent); }
    100% { transform: scale(1); }
  }

  .btn-retry {
    padding: 12px 32px; font-size: 16px; font-weight: bold; color: #fff; background: var(--accent);
    border: none; border-radius: 24px; cursor: pointer; box-shadow: 0 4px 12px rgba(220,38,38,0.4);
    transition: transform 0.1s, background-color 0.2s;
  }
  .btn-retry:active { transform: scale(0.95); }

  canvas#leaves {
    position: absolute; inset: 0; width: 100%; height: 100%;
    display: block; pointer-events: none;
  }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="sim" aria-label="トロッコ描写" role="img"></canvas>
    <canvas id="leaves" aria-hidden="true"></canvas>
    <div class="hud">
      <div class="panel" id="panel">
        <h1>トロッコアドベンチャー</h1>
        <div class="stats-row">
          <div class="stat-box">
            <div class="stat-label">正解数</div>
            <div class="stat-val score-num"><span id="score">0</span><span class="stat-sub">/<span id="score-max">7</span></span></div>
          </div>
          <div class="stat-box">
            <div class="stat-label">ミス</div>
            <div class="stat-val miss-num"><span id="misses">0</span><span class="stat-sub">/<span id="max-misses">1</span></span></div>
          </div>
        </div>
        <div class="progress-dots" id="progress-dots"></div>
      </div>

      <div id="left-timer-bar" class="side-timer-bar left">
        <div id="left-timer-fill" class="side-timer-fill"></div>
      </div>
      <div id="right-timer-bar" class="side-timer-bar right">
        <div id="right-timer-fill" class="side-timer-fill"></div>
      </div>

      <div id="center-arrow" class="center-choice-arrow"></div>

      <div id="question-panel" class="question-panel">
        <div class="question-timer-row">
          <div class="question-timer-track"><div class="question-timer-fill" id="timer-fill"></div></div>
          <div class="question-timer-num" id="timer-num">15.0s</div>
        </div>
        <div id="question-text" class="question-text"></div>
        <div class="question-choices">
          <div class="choice-btn choice-maru" data-choice="left">
            <div class="choice-mark">○</div>
            <div class="choice-label">正 (←)</div>
          </div>
          <div class="choice-btn choice-batsu" data-choice="right">
            <div class="choice-mark">✕</div>
            <div class="choice-label">誤 (→)</div>
          </div>
        </div>
      </div>

      <div id="start-overlay" class="overlay-screen show" style="display:flex;">
        <button class="btn-retry" id="start-btn">GameStart</button>
      </div>

      <div id="gameover-overlay" class="overlay-screen">
        <h2>満身創痍</h2>
        <p>記録: <span id="final-score">0</span> 正解</p>
        <button class="btn-retry" id="retry-btn">Retry</button>
      </div>

      <div id="gameclear-overlay" class="overlay-screen">
        <h2>GAME CLEAR!</h2>
        <p><span id="clear-target-num">7</span>問正解達成‼</p>
        <button class="btn-retry" id="clear-retry-btn">もう一度挑戦</button>
      </div>
    </div>
  </div>

  <audio id="se-correct" src="se_sod05.wav" preload="auto"></audio>
  <audio id="se-incorrect" src="se_mob05.wav" preload="auto"></audio>
  <audio id="se-gameover" src="nc899.wav" preload="auto"></audio>
  <audio id="bgm" src="DARK-021.wav" preload="auto" loop></audio>

<script src="quiz-questions.js"></script>
<script>
(() => {
  const canvas = document.getElementById('sim');
  const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
  let W=0, H=0, DPR=1;

  // ---- イチョウの落ち葉演出（常時ループする独立レイヤー） ----
  const leavesCanvas = document.getElementById('leaves');
  const leavesCtx = leavesCanvas ? leavesCanvas.getContext('2d') : null;
  let LW = 0, LH = 0, LDPR = 1;

  function resizeLeaves() {
    if (!leavesCanvas) return;
    LDPR = Math.min(2, window.devicePixelRatio || 1);
    LW = leavesCanvas.clientWidth * LDPR;
    LH = leavesCanvas.clientHeight * LDPR;
    leavesCanvas.width = LW;
    leavesCanvas.height = LH;
  }
  window.addEventListener('resize', resizeLeaves, { passive: true });

  const LEAF_COLORS = ['#facc15', '#eab308', '#fde047', '#ca8a04', '#d97706'];
  const LEAF_COUNT = 24;
  let leaves = [];

  function makeLeaf(spawnAnywhere) {
    const size = (16 + Math.random() * 18) * LDPR;
    return {
      x: Math.random() * LW,
      y: spawnAnywhere ? Math.random() * LH : -size * 1.4,
      size,
      speed: (16 + Math.random() * 20) * LDPR,
      swayAmp: (18 + Math.random() * 28) * LDPR,
      swaySpeed: 0.5 + Math.random() * 0.9,
      swayPhase: Math.random() * Math.PI * 2,
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 1.3,
      flip: Math.random() < 0.5 ? 1 : -1,
      color: LEAF_COLORS[Math.floor(Math.random() * LEAF_COLORS.length)],
      alpha: 0.55 + Math.random() * 0.35,
      t: Math.random() * 100,
    };
  }

  function initLeaves() {
    leaves = [];
    for (let i = 0; i < LEAF_COUNT; i++) leaves.push(makeLeaf(true));
  }

  function drawGinkgoLeafShape(g, s) {
    g.beginPath();
    g.moveTo(0, s * 0.95);
    g.bezierCurveTo(-s * 0.1, s * 0.7, -s * 0.4, s * 0.85, -s * 0.9, s * 0.4);
    g.bezierCurveTo(-s * 0.6, s * 0.35, -s * 0.5, s * 0.1, -s * 0.95, -s * 0.1);
    g.bezierCurveTo(-s * 0.6, -s * 0.05, -s * 0.7, -s * 0.3, -s * 0.5, -s * 0.6);
    g.bezierCurveTo(-s * 0.35, -s * 0.45, -s * 0.2, -s * 0.6, -s * 0.05, -s * 0.95);
    g.bezierCurveTo(s * 0.2, -s * 0.6, s * 0.35, -s * 0.45, s * 0.5, -s * 0.6);
    g.bezierCurveTo(s * 0.7, -s * 0.3, s * 0.6, -s * 0.05, s * 0.95, -s * 0.1);
    g.bezierCurveTo(s * 0.5, s * 0.1, s * 0.6, s * 0.35, s * 0.9, s * 0.4);
    g.bezierCurveTo(s * 0.4, s * 0.85, s * 0.1, s * 0.7, 0, s * 0.95);
    g.closePath();
  }

  function updateLeaves(dt) {
    if (!leaves.length) return;
    for (const lf of leaves) {
      lf.t += dt;
      lf.y += lf.speed * dt;
      lf.x += Math.sin(lf.t * lf.swaySpeed + lf.swayPhase) * lf.swayAmp * dt * 0.6;
      lf.rot += lf.rotSpeed * dt;
      if (lf.y - lf.size > LH + 20) {
        const fresh = makeLeaf(false);
        Object.assign(lf, fresh);
      }
      if (lf.x < -40) lf.x = LW + 40;
      if (lf.x > LW + 40) lf.x = -40;
    }
  }

  function drawLeaves() {
    if (!leavesCtx) return;
    leavesCtx.clearRect(0, 0, LW, LH);
    for (const lf of leaves) {
      leavesCtx.save();
      leavesCtx.globalAlpha = lf.alpha;
      leavesCtx.translate(lf.x, lf.y);
      leavesCtx.rotate(lf.rot);
      leavesCtx.scale(lf.flip, 1);
      drawGinkgoLeafShape(leavesCtx, lf.size * 0.5);
      leavesCtx.fillStyle = lf.color;
      leavesCtx.fill();
      leavesCtx.restore();
    }
  }

  let lastLeafTime = performance.now();
  function leafFrame(now) {
    const dt = Math.min(0.05, (now - lastLeafTime) / 1000);
    lastLeafTime = now;
    updateLeaves(dt);
    drawLeaves();
    requestAnimationFrame(leafFrame);
  }

  const startBgImage = new Image();
  startBgImage.src = 'startoverlay.jpg';

  const bgImage = new Image();
  let bgLoaded = false;
  bgImage.onload = () => { bgLoaded = true; };
  bgImage.src = '洞窟1.jpg';

  const bgImage2 = new Image();
  let bgLoaded2 = false;

  const DEFAULT_QUESTIONS = [
    { text: "太陽は地球の周りを回っている", answer: false },
    { text: "富士山は日本で一番高い山である", answer: true },
    { text: "1年は300日である", answer: false },
  ];

  function getQuestionSource(){ 
    const rawSource = (window.QUIZ_QUESTIONS && window.QUIZ_QUESTIONS.length) ? window.QUIZ_QUESTIONS : DEFAULT_QUESTIONS; 
    const seen = new Set();
    return rawSource.filter(q => {
      const key = q.text.trim().replace(/\s+/g, '');
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
  }
  
  function shuffle(arr){ 
    const a = arr.slice(); 
    for(let i=a.length-1; i>0; i--){ 
      const j=Math.floor(Math.random()*(i+1)); 
      [a[i],a[j]]=[a[j],a[i]]; 
    } 
    return a; 
  }

  let questionPool = [];
  let poolIndex = 0;

  function initQuestionPool() {
    const source = getQuestionSource();
    const maruList = shuffle(source.filter(q => q.answer === true));
    const batsuList = shuffle(source.filter(q => q.answer === false));
    
    const balanced = [];
    let m = 0, b = 0;
    while (m < maruList.length || b < batsuList.length) {
      if (m < maruList.length) balanced.push(maruList[m++]);
      if (b < batsuList.length) balanced.push(batsuList[b++]);
    }

    questionPool = shuffle(balanced).slice(0, MAX_QUESTIONS);
    poolIndex = 0;
  }

  function nextQuestion(){
    if (poolIndex >= questionPool.length) { 
      return null;
    }
    return questionPool[poolIndex++];
  }

  const GAME_STATE = { RUNNING: 'running', WAITING: 'waiting', BRAKING: 'braking', FALLING: 'falling', GAMEOVER: 'gameover', GAMECLEAR: 'gameclear' };

  const FOG_NEAR = 26;
  const FOG_FAR = 48;
  function fogAlpha(cz) {
    if (cz <= FOG_NEAR) return 1;
    if (cz >= FOG_FAR) return 0;
    return 1 - (cz - FOG_NEAR) / (FOG_FAR - FOG_NEAR);
  }

  let state = { speed: 0, score: 0, misses: 0, gameState: GAME_STATE.RUNNING, fallProgress: 0, questionTimer: 0, questionTimerMax: 0, brakeTimer: 0 };

  function spawnExplosion(cx, cy) {
    for (let i = 0; i < 46; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = 60 + Math.random() * 260;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 40,
        life: 0.5 + Math.random() * 0.6,
        age: 0,
        r: 3 + Math.random() * 6,
        hue: Math.random() < 0.5 ? '255,180,60' : '255,90,40'
      });
    }
    for (let i = 0; i < 14; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = 40 + Math.random() * 180;
      debris.push({
        x: cx, y: cy,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 80,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 10,
        life: 0.8 + Math.random() * 0.7,
        age: 0,
        size: 4 + Math.random() * 8
      });
    }
    flashAlpha = 1;
    screenShake = 1;
  }

  function updateExplosion(dt) {
    let w = 0;
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt; p.vx *= (1 - 1.5 * dt);
      if (p.age < p.life) particles[w++] = p;
    }
    particles.length = w;

    w = 0;
    for (let i = 0; i < debris.length; i++) {
      const d = debris[i];
      d.age += dt; d.x += d.vx * dt; d.y += d.vy * dt; d.vy += 320 * dt; d.rot += d.vr * dt;
      if (d.age < d.life) debris[w++] = d;
    }
    debris.length = w;

    flashAlpha = Math.max(0, flashAlpha - dt * 2.6);
    screenShake = Math.max(0, screenShake - dt * 1.4);
  }

  function drawExplosion() {
    if (particles.length) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (const p of particles) {
        const t = 1 - p.age / p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * DPR * (0.4 + t * 0.6), 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${p.hue},${(t * 0.9).toFixed(3)})`;
        ctx.fill();
      }
      ctx.restore();
    }
    if (debris.length) {
      ctx.save();
      for (const d of debris) {
        const t = 1 - d.age / d.life;
        ctx.save();
        ctx.translate(d.x, d.y);
        ctx.rotate(d.rot);
        ctx.fillStyle = `rgba(40,30,26,${(t * 0.95).toFixed(3)})`;
        ctx.fillRect(-d.size * DPR / 2, -d.size * DPR / 2, d.size * DPR, d.size * DPR);
        ctx.restore();
      }
      ctx.restore();
    }
  }

  function drawSpeedLines(ratio) {
    if (ratio < 0.5) return;
    const cx = W / 2, cy = H * 0.5;
    const n = 10;
    const innerR = Math.min(W, H) * 0.3;
    const len = Math.min(W, H) * (0.15 + (ratio - 0.5) * 0.55);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < n; i++) {
      const ang = (i / n) * Math.PI * 2 + 0.3;
      const cosA = Math.cos(ang), sinA = Math.sin(ang) * 0.6;
      ctx.beginPath();
      ctx.moveTo(cx + cosA * innerR, cy + sinA * innerR);
      ctx.lineTo(cx + cosA * (innerR + len), cy + sinA * (innerR + len));
      ctx.strokeStyle = `rgba(255,255,255,${((ratio - 0.5) * 0.4).toFixed(3)})`;
      ctx.lineWidth = 2 * DPR;
      ctx.stroke();
    }
    ctx.restore();
  }

  let mainPath = [];        
  let objects = [];         
  let genHead = { dist: 0, x: 0, z: 0, yaw: 0 };

  let fallAtDistance = null;
  
  let nextSleeperDist = 0;

  function resize(){
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = canvas.clientWidth * DPR; H = canvas.clientHeight * DPR;
    canvas.width = W; canvas.height = H;
  }
  window.addEventListener('resize', resize, { passive: true });
  resize();

  function makePathPoints(startDist, startX, startZ, startYaw, length, curvature, step) {
    const pts = [];
    let d = step;
    let x = startX, z = startZ, yaw = startYaw;
    while (d <= length + 0.001) {
      x += Math.sin(yaw) * step;
      z += Math.cos(yaw) * step;
      yaw += curvature * step;
      pts.push({ dist: startDist + d, x, z, yaw });
      d += step;
    }
    return { pts, endDist: startDist + length, endX: x, endZ: z, endYaw: yaw };
  }

  function placeObjectsOnPath(pts) {
    if (pts.length < 2) return;
    let prev = pts[0];
    for (let i = 1; i < pts.length; i++) {
      let curr = pts[i];
      
      const prx = Math.cos(prev.yaw) * RAIL_GAUGE/2, prz = -Math.sin(prev.yaw) * RAIL_GAUGE/2;
      const crx = Math.cos(curr.yaw) * RAIL_GAUGE/2, crz = -Math.sin(curr.yaw) * RAIL_GAUGE/2;
      objects.push({ type: 'line', color: '#334155', w: 10, dist: curr.dist, x1: prev.x - prx, y1: 0, z1: prev.z - prz, x2: curr.x - crx, y2: 0, z2: curr.z - crz });
      objects.push({ type: 'line', color: '#334155', w: 10, dist: curr.dist, x1: prev.x + prx, y1: 0, z1: prev.z + prz, x2: curr.x + crx, y2: 0, z2: curr.z + crz });

      const distDelta = Math.max(0.0001, curr.dist - prev.dist);

      while (nextSleeperDist <= curr.dist) {
        const t = (nextSleeperDist - prev.dist) / distDelta;
        objects.push({ type: 'sleeper', dist: nextSleeperDist, 
          x: prev.x + (curr.x - prev.x) * t, z: prev.z + (curr.z - prev.z) * t, yaw: prev.yaw + (curr.yaw - prev.yaw) * t });
        nextSleeperDist += 0.65;
      }

      const PILLAR_DEPTH = 300; 
      while (nextPillarDist <= curr.dist) {
        const t = (nextPillarDist - prev.dist) / distDelta;
        const x = prev.x + (curr.x - prev.x) * t;
        const z = prev.z + (curr.z - prev.z) * t;
        const yaw = prev.yaw + (curr.yaw - prev.yaw) * t;
        
        const rx = Math.cos(yaw) * (RAIL_GAUGE / 2 + 0.2);
        const rz = -Math.sin(yaw) * (RAIL_GAUGE / 2 + 0.2);

        objects.push({ type: 'line', color: '#2d231f', w: 4, dist: nextPillarDist, 
                       x1: x - rx, y1: 0, z1: z - rz, x2: x - rx, y2: -PILLAR_DEPTH, z2: z - rz });
        objects.push({ type: 'line', color: '#2d231f', w: 4, dist: nextPillarDist, 
                       x1: x + rx, y1: 0, z1: z + rz, x2: x + rx, y2: -PILLAR_DEPTH, z2: z + rz });
        objects.push({ type: 'line', color: '#43332c', w: 3, dist: nextPillarDist, 
                       x1: x - rx, y1: -2, z1: z - rz, x2: x + rx, y2: -2, z2: z + rz });

        nextPillarDist += 4.0;
      }

      prev = curr;
    }
  }

  function generateBranchOptions() {
    let q = nextQuestion();
    if (!q) return;

    const savedSleeper = nextSleeperDist, savedPillar = nextPillarDist;

    let leftPath = makePathPoints(genHead.dist, genHead.x, genHead.z, genHead.yaw, BRANCH_LEN, -CURVE_STRENGTH, 2);
    placeObjectsOnPath([genHead, ...leftPath.pts]);

    nextSleeperDist = savedSleeper; nextPillarDist = savedPillar;
    let rightPath = makePathPoints(genHead.dist, genHead.x, genHead.z, genHead.yaw, BRANCH_LEN, CURVE_STRENGTH, 2);
    placeObjectsOnPath([genHead, ...rightPath.pts]);

    const midLeft = leftPath.pts[Math.floor(leftPath.pts.length / 2)], midRight = rightPath.pts[Math.floor(rightPath.pts.length / 2)];
    objects.push({ type: 'sign', text: '○', x: midLeft.x, y: 4.5, z: midLeft.z, dist: midLeft.dist });
    objects.push({ type: 'sign', text: '✕', x: midRight.x, y: 4.5, z: midRight.z, dist: midRight.dist });

    pendingBranch = {
      dist: genHead.dist,
      leftPath: leftPath.pts, rightPath: rightPath.pts,
      leftTail: { dist: leftPath.endDist, x: leftPath.endX, z: leftPath.endZ, yaw: leftPath.endYaw },
      rightTail: { dist: rightPath.endDist, x: rightPath.endX, z: rightPath.endZ, yaw: rightPath.endYaw },
      correct: q.answer ? 'left' : 'right',
      question: q,
      revealed: false,
      chosenDir: null,
      evaluated: false
    };
  }

  function updateTrackGeneration() {
    while (genHead.dist < distance + VIEW_DISTANCE) {
      if (pendingBranch || fallAtDistance !== null) break; 

      if (state.gameState !== GAME_STATE.BRAKING && genHead.dist >= nextBranchDist) {
        generateBranchOptions();
        break;
      } else {
        let len = Math.min(nextBranchDist - genHead.dist, (distance + VIEW_DISTANCE) - genHead.dist);
        
        len = Math.floor(len / 0.5) * 0.5;

        if (len > 0) {
          const path = makePathPoints(genHead.dist, genHead.x, genHead.z, genHead.yaw, len, 0, 0.5);
          placeObjectsOnPath([genHead, ...path.pts]);
          mainPath.push(...path.pts);
          
          genHead.dist = path.endDist; genHead.x = path.endX; genHead.z = path.endZ; genHead.yaw = path.endYaw;
        } else {
          break;
        }
      }
    }
  }

    initQuestionPool();
    mainPath = [{ dist: 0, x: 0, z: 0, yaw: 0 }];

    timerFillEl.classList.remove('urgent'); timerNumEl.classList.remove('urgent');
    leftTimerFillEl.classList.remove('urgent'); rightTimerFillEl.classList.remove('urgent');

  const overlayEl = document.getElementById('question-panel'), questionTextEl = document.getElementById('question-text');

    if (arrowPulseTimer) { clearTimeout(arrowPulseTimer); arrowPulseTimer = null; }

  function showCenterArrow(choice) {
    clearArrowTimers();
    arrowActiveDir = choice;
    centerArrowEl.classList.remove('show', 'pulse', 'exit', 'dir-left', 'dir-right');

  function showOverlayFade(el) {
    el.style.display = 'flex';

  function hideOverlayFade(el) {
    el.classList.remove('show');

    leftTimerBar.classList.add('disappear');

  function revealQuestion(branch, remainingDist) {
    branch.revealed = true;
    const speedNow = Math.max(0.01, state.speed);
    const lead = Math.max(0.01, remainingDist / speedNow);
    state.questionTimer = lead;
    state.questionTimerMax = lead;
    questionTextEl.textContent = branch.question ? branch.question.text : '';
    
    updateQuestionTimerUI();
    overlayEl.classList.remove('minimized');
    showOverlayFade(overlayEl);

    leftTimerBar.classList.remove('disappear');
    rightTimerBar.classList.remove('disappear');
    leftTimerBar.style.display = 'block';
    rightTimerBar.style.display = 'block';
    requestAnimationFrame(() => requestAnimationFrame(() => {
      leftTimerBar.classList.add('show');
      rightTimerBar.classList.add('show');
    }));

    state.gameState = GAME_STATE.WAITING;
  }

  function updateQuestionTimerUI() {
    const ratio = state.questionTimerMax > 0 ? Math.max(0, state.questionTimer / state.questionTimerMax) : 0;
    const timeStr = Math.max(0, state.questionTimer).toFixed(1) + 's';
    const percentStr = (ratio * 100).toFixed(1) + '%';
    const heightStr = (ratio * 100).toFixed(1) + '%';

    timerFillEl.style.width = percentStr;
    timerNumEl.textContent = timeStr;
    
    leftTimerFillEl.style.height = heightStr;
    rightTimerFillEl.style.height = heightStr;

    const urgent = state.questionTimer > 0 && state.questionTimer <= 5.0;
    timerFillEl.classList.toggle('urgent', urgent);
    timerNumEl.classList.toggle('urgent', urgent);
    leftTimerFillEl.classList.toggle('urgent', urgent);
    rightTimerFillEl.classList.toggle('urgent', urgent);
  }

  function choiceMade(choice) {
    if (!pendingBranch || state.gameState !== GAME_STATE.WAITING) return;
    
    overlayEl.classList.add('minimized');
    showCenterArrow(choice);

    pendingBranch.chosenDir = choice;
    const chosenPath = choice === 'left' ? pendingBranch.leftPath : pendingBranch.rightPath;
    const chosenTail = choice === 'left' ? pendingBranch.leftTail : pendingBranch.rightTail;
    
    mainPath.push(...chosenPath);
    genHead = { ...chosenTail };

    bankTarget = choice === 'left' ? BANK_TILT : -BANK_TILT;
    bankUntilDist = chosenTail.dist;

    state.gameState = GAME_STATE.RUNNING;
  }

  function evaluateBranch() {
    if (!pendingBranch || pendingBranch.evaluated) return;
    pendingBranch.evaluated = true;
    
    hideOverlayFade(overlayEl);
    hideSideTimers();
    hideCenterArrow();

    if (!pendingBranch.chosenDir) {
      pendingBranch.chosenDir = pendingBranch.correct === 'left' ? 'right' : 'left';
      const chosenPath = pendingBranch.chosenDir === 'left' ? pendingBranch.leftPath : pendingBranch.rightPath;
      const chosenTail = pendingBranch.chosenDir === 'left' ? pendingBranch.leftTail : pendingBranch.rightTail;
      mainPath.push(...chosenPath);
      genHead = { ...chosenTail };
      bankTarget = pendingBranch.chosenDir === 'left' ? BANK_TILT : -BANK_TILT;
      bankUntilDist = chosenTail.dist;
    }

    const choice = pendingBranch.chosenDir;
    const chosenTail = choice === 'left' ? pendingBranch.leftTail : pendingBranch.rightTail;
    const answeredIndex = state.score + state.misses;

    if (choice === pendingBranch.correct) {
      playSE(seCorrectEl);
      state.score++; 
      scoreEl.textContent = state.score;
      scoreEl.classList.remove('score-pop');
      void scoreEl.offsetWidth; 
      scoreEl.classList.add('score-pop');
      feedbackFlash = 1; feedbackFlashColor = '34,197,94';
      markProgressDot(answeredIndex, true);

      if (state.score >= CLEAR_SCORE) {
        state.gameState = GAME_STATE.BRAKING;
        state.brakeTimer = 0;
        screenShake = 0.8;
        pendingBranch = null;
        return;
      } else {
        nextBranchDist = genHead.dist + STRAIGHT_LEN;
      }
    } else {
      playSE(seIncorrectEl);
      state.misses++;
      if (missesEl) missesEl.textContent = state.misses;
      feedbackFlash = 1; feedbackFlashColor = '239,68,68';
      markProgressDot(answeredIndex, false);

      if (state.misses >= ALLOWED_MISSES + 1) { 
        fallAtDistance = chosenTail.dist;
        pendingBranch = null;
        return;
      }

      if (state.score + state.misses >= questionPool.length) {
        state.gameState = GAME_STATE.BRAKING;
        state.brakeTimer = 0;
        screenShake = 0.8;
        pendingBranch = null;
        return;
      } else {
        nextBranchDist = genHead.dist + STRAIGHT_LEN;
      }
    }
    pendingBranch = null;
  }

  window.addEventListener('keydown', (e) => {
    if (!gameStarted) {
      if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        startGame();
      }
      return;
    }
    if (state.gameState === GAME_STATE.WAITING) {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') choiceMade('left');
      if (e.code === 'ArrowRight' || e.code === 'KeyD') choiceMade('right');
    } else if (state.gameState === GAME_STATE.GAMEOVER || state.gameState === GAME_STATE.GAMECLEAR) {
      if (e.code === 'Space' || e.code === 'Enter') backToStart();
    }
  });

  document.querySelectorAll('[data-choice]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      choiceMade(el.dataset.choice);
    });
  });

  retryBtn.addEventListener('click', backToStart);
  clearRetryBtn.addEventListener('click', backToStart);

  const startOverlay = document.getElementById('start-overlay');
  const startBtn = document.getElementById('start-btn');

  function unlockSeElements() {
    [seCorrectEl, seIncorrectEl, seGameoverEl, bgmEl].forEach(el => {
      if (!el) return;
      try {
        const p = el.play();
        if (p && typeof p.catch === 'function') p.catch(() => {});
        el.pause();
        el.currentTime = 0;
      } catch (e) {}
    });
  }

  function startGame() {
    if (gameStarted) return;
    gameStarted = true;
    unlockSeElements();
    bgmShouldPlay = true;
    if (bgmEl) {
      bgmEl.currentTime = 0;
      bgmEl.play().catch(() => {});
    }
    hideOverlayFade(startOverlay);
  }
  startBtn.addEventListener('click', startGame);

  function getCameraState(targetDist) {
    if (mainPath.length === 0) return { x:0, z:0, yaw:0 };
    
    if (targetDist >= mainPath[mainPath.length-1].dist) {
      const lastPt = mainPath[mainPath.length-1];
      const overflow = targetDist - lastPt.dist;
      return {
        x: lastPt.x + Math.sin(lastPt.yaw) * overflow,
        z: lastPt.z + Math.cos(lastPt.yaw) * overflow,
        yaw: lastPt.yaw,
        dist: targetDist
      };
    }
    if (targetDist <= mainPath[0].dist) return mainPath[0];

    let l = 0, r = mainPath.length - 1;
    while (l <= r) {
      let m = (l + r) >> 1;
      if (mainPath[m].dist < targetDist) l = m + 1; else r = m - 1;
    }
    let p1 = mainPath[l - 1], p2 = mainPath[l];
    let t = (targetDist - p1.dist) / Math.max(0.0001, (p2.dist - p1.dist));
    return { x: p1.x + (p2.x - p1.x) * t, z: p1.z + (p2.z - p1.z) * t, yaw: p1.yaw + (p2.yaw - p1.yaw) * t };
  }

  function toCameraSpace(wx, wy, wz, camX, camY, camZ, camYaw, out) {
    const dx = wx - camX, dy = wy - camY, dz = wz - camZ;
    const cos = Math.cos(camYaw), sin = Math.sin(camYaw);
    out.cx = dx * cos - dz * sin; out.cy = dy; out.cz = dx * sin + dz * cos;
    return out;
  }

  function applyPitch(cx, cy, cz, pitch, out) {
    const cos = Math.cos(pitch), sin = Math.sin(pitch);
    out.cx = cx; out.cy = cy * cos + cz * sin; out.cz = -cy * sin + cz * cos;
    return out;
  }

  function clipLine(pOut, pIn, nearZ, out) {
    const t = (nearZ - pOut.cz) / (pIn.cz - pOut.cz);
    out.cx = pOut.cx + (pIn.cx - pOut.cx) * t; out.cy = pOut.cy + (pIn.cy - pOut.cy) * t; out.cz = nearZ;
    return out;
  }

  function project(cx, cy, cz, out) {
    if (cz < viewNear) return null;
    const scale = focal / cz;
    out.px = W/2 + cx * scale * DPR; out.py = H/2 - cy * scale * DPR;
    return out;
  }

  let last = performance.now();
  function frame(now){
    const dt = Math.min(0.05, (now-last)/1000);
    last = now;
    
    if (gameStarted && (state.gameState === GAME_STATE.RUNNING || state.gameState === GAME_STATE.WAITING)) {
      const isWaiting = state.gameState === GAME_STATE.WAITING;

      state.speed = maxSpeed;
      distance += state.speed * dt;

      camY = 1.5 + Math.sin(distance * 2.2) * 0.025;

      const tiltTarget = (bankUntilDist >= 0 && distance < bankUntilDist) ? bankTarget : 0;
      laneTilt += (tiltTarget - laneTilt) * Math.min(1, dt * 6);

      if (isWaiting) {
        state.questionTimer -= dt;
        updateQuestionTimerUI();
        if (state.questionTimer <= 0) {
          const wrongDir = pendingBranch && pendingBranch.correct === 'left' ? 'right' : 'left';
          choiceMade(wrongDir);
        }
      } else if (pendingBranch && pendingBranch.revealed && !pendingBranch.evaluated) {
        state.questionTimer -= dt;
        updateQuestionTimerUI();
      } else if (pendingBranch && !pendingBranch.revealed) {
        const remaining = pendingBranch.dist - distance;
        const requiredLead = STRAIGHT_LEN;
        if (remaining <= requiredLead) {
          revealQuestion(pendingBranch, remaining);
        }
      }

      if (pendingBranch && distance >= pendingBranch.dist) {
        evaluateBranch();
      }

      if (fallAtDistance !== null && distance >= fallAtDistance) {
        distance = fallAtDistance;
        state.gameState = GAME_STATE.FALLING;
      }

      updateTrackGeneration();

      {
        let w = 0;
        for (let i = 0; i < objects.length; i++) {
          if (objects[i].dist > distance - 30) objects[w++] = objects[i];
        }
        objects.length = w;
      }
      while(mainPath.length > 2 && mainPath[1].dist < distance - 5) mainPath.shift();

    } else if (gameStarted && state.gameState === GAME_STATE.BRAKING) {
      state.speed = Math.max(0, state.speed - maxSpeed * 2.2 * dt);
      distance += state.speed * dt;
      state.brakeTimer += dt;
      screenShake = Math.max(0, screenShake - dt * 2);

      if (state.speed <= 0.1 || state.brakeTimer >= 1.2) {
        state.speed = 0;
        state.gameState = GAME_STATE.GAMECLEAR;
        bgmShouldPlay = false;
        if (bgmEl) {
          bgmEl.pause();
          bgmEl.currentTime = 0;
        }
        showOverlayFade(gameclearOverlay);
      }
    } else if (gameStarted && state.gameState === GAME_STATE.FALLING) {
      state.fallProgress += dt * 0.5;
      camY -= dt * 18;
      camPitch -= dt * 1.8;
      camRoll += dt * (0.6 + state.fallProgress * 1.6);
      bgScrollY += dt * (260 + state.fallProgress * 900) * DPR;
      updateExplosion(dt);
      if (state.fallProgress >= 1) {
        state.gameState = GAME_STATE.GAMEOVER;
        bgmShouldPlay = false;
        if (bgmEl) {
          bgmEl.pause();
          bgmEl.currentTime = 0;
        }
        finalScoreEl.textContent = state.score;
        spawnExplosion(W / 2, H * 0.58);
        playSE(seGameoverEl);
        showOverlayFade(gameoverOverlay);
      }
    } else {
      updateExplosion(dt);
    }

    feedbackFlash = Math.max(0, feedbackFlash - dt * 2.5);
    
    draw();
    requestAnimationFrame(frame);
  }

  const _camA = { cx: 0, cy: 0, cz: 0 };
  const _camB = { cx: 0, cy: 0, cz: 0 };
  const _camC = { cx: 0, cy: 0, cz: 0 };
  const _scrA = { px: 0, py: 0 };
  const _scrB = { px: 0, py: 0 };
  const _cornerCam = [
    { cx: 0, cy: 0, cz: 0 }, { cx: 0, cy: 0, cz: 0 }, { cx: 0, cy: 0, cz: 0 }, { cx: 0, cy: 0, cz: 0 }
  ];
  const _cornerScr = { px: 0, py: 0 };
  const _sleeperWX = [0, 0, 0, 0], _sleeperWZ = [0, 0, 0, 0];

  let renderList = [];
  let renderOrder = [];
  let renderCount = 0;
  function getRenderItem() {
    let it = renderList[renderCount];
    if (!it) { it = { pxs: [0, 0, 0, 0], pys: [0, 0, 0, 0] }; renderList[renderCount] = it; }
    renderCount++;
    return it;
  }

  function draw(){
    const isFalling = state.gameState === GAME_STATE.FALLING;
    const isGameOver = state.gameState === GAME_STATE.GAMEOVER;
    const isFallingOrGameOver = isFalling || isGameOver;

    ctx.save();

    ctx.translate(W / 2, H / 2);
    if (isFalling) {
      if (screenShake > 0) {
        ctx.translate((Math.random() - 0.5) * screenShake * 22 * DPR, (Math.random() - 0.5) * screenShake * 22 * DPR);
      }
      ctx.rotate(Math.sin(camRoll) * 0.06 * Math.min(1, state.fallProgress * 2));
    } else if (screenShake > 0) {
      ctx.translate((Math.random() - 0.5) * screenShake * 16 * DPR, (Math.random() - 0.5) * screenShake * 16 * DPR);
    } else if (Math.abs(laneTilt) > 0.0005) {
      ctx.rotate(laneTilt);
    }
    ctx.translate(-W / 2, -H / 2);

    if (isFallingOrGameOver && bgLoaded2) {
      if (isFalling) {
        const zoom = 1 + state.fallProgress * 0.4;
        ctx.save();
        ctx.translate(W/2, H/2);
        ctx.scale(zoom, zoom);
        ctx.translate(-W/2, -H/2);
        const segH = H;
        const off = bgScrollY % segH;
        ctx.drawImage(bgImage2, 0, -off - segH, W, segH);
        ctx.drawImage(bgImage2, 0, -off, W, segH);
        ctx.restore();
      } else {
        ctx.drawImage(bgImage2, 0, 0, W, H);
      }
    } else if (!isFallingOrGameOver && bgLoaded) {
      ctx.drawImage(bgImage, 0, 0, W, H);
    } else {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0,0,W,H);
    }

    let camState = getCameraState(distance);
    let camX = camState.x, camZ = camState.z, camYaw = camState.yaw;

    renderCount = 0;

    for (let obj of objects) {
      if (obj.type === 'line') {
        let p1 = toCameraSpace(obj.x1, obj.y1, obj.z1, camX, camY, camZ, camYaw, _camA);
        p1 = applyPitch(p1.cx, p1.cy, p1.cz, camPitch, _camA);
        let p2 = toCameraSpace(obj.x2, obj.y2, obj.z2, camX, camY, camZ, camYaw, _camB);
        p2 = applyPitch(p2.cx, p2.cy, p2.cz, camPitch, _camB);
        if (p1.cz < viewNear && p2.cz < viewNear) continue;
        if (p1.cz < viewNear) p1 = clipLine(p1, p2, viewNear, _camC);
        if (p2.cz < viewNear) p2 = clipLine(p2, p1, viewNear, _camC);

        let s1 = project(p1.cx, p1.cy, p1.cz, _scrA), s2 = project(p2.cx, p2.cy, p2.cz, _scrB);
        const lineZ = (p1.cz+p2.cz)/2;
        const lineAlpha = fogAlpha(lineZ);
        if (s1 && s2 && lineAlpha > 0.01) {
          const it = getRenderItem();
          it.type = 'line'; it.s1x = s1.px; it.s1y = s1.py; it.s2x = s2.px; it.s2y = s2.py;
          it.color = obj.color; it.w = obj.w; it.z = lineZ; it.alpha = lineAlpha;
        }

      } else if (obj.type === 'sleeper') {
        const hw = 1.6/2, hd = 0.3/2;
        const rx = Math.cos(obj.yaw), rz = -Math.sin(obj.yaw);
        const dx = Math.sin(obj.yaw), dz = Math.cos(obj.yaw);
        _sleeperWX[0] = obj.x - rx*hw + dx*hd; _sleeperWZ[0] = obj.z - rz*hw + dz*hd;
        _sleeperWX[1] = obj.x + rx*hw + dx*hd; _sleeperWZ[1] = obj.z + rz*hw + dz*hd;
        _sleeperWX[2] = obj.x + rx*hw - dx*hd; _sleeperWZ[2] = obj.z + rz*hw - dz*hd;
        _sleeperWX[3] = obj.x - rx*hw - dx*hd; _sleeperWZ[3] = obj.z - rz*hw - dz*hd;

        let behind = false;
        for (let i = 0; i < 4; i++) {
          let c = toCameraSpace(_sleeperWX[i], 0, _sleeperWZ[i], camX, camY, camZ, camYaw, _cornerCam[i]);
          applyPitch(c.cx, c.cy, c.cz, camPitch, _cornerCam[i]);
          if (_cornerCam[i].cz < viewNear) { behind = true; break; }
        }
        if (behind) continue;

        const sleeperZ = _cornerCam[0].cz;
        const sleeperAlpha = fogAlpha(sleeperZ);
        if (sleeperAlpha > 0.01) {
          const it = getRenderItem();
          it.type = 'poly'; it.color = '#523d2d'; it.z = sleeperZ; it.alpha = sleeperAlpha;
          for (let i = 0; i < 4; i++) {
            const p = project(_cornerCam[i].cx, _cornerCam[i].cy, _cornerCam[i].cz, _cornerScr);
            it.pxs[i] = p ? p.px : 0; it.pys[i] = p ? p.py : 0;
          }
        }

      } else if (obj.type === 'sign') {
        let c = toCameraSpace(obj.x, obj.y, obj.z, camX, camY, camZ, camYaw, _camA);
        c = applyPitch(c.cx, c.cy, c.cz, camPitch, _camA);
        if (c.cz < viewNear) continue;
        let p = project(c.cx, c.cy, c.cz, _scrA);
        if (p) {
          const it = getRenderItem();
          it.type = 'sign'; it.text = obj.text; it.px = p.px; it.py = p.py; it.z = c.cz;
        }
      }
    }

    for (let i = 0; i < renderCount; i++) renderOrder[i] = i;
    renderOrder.length = renderCount;
    renderOrder.sort((a, b) => renderList[b].z - renderList[a].z);

    for (let oi = 0; oi < renderCount; oi++) {
      const r = renderList[renderOrder[oi]];
      if (r.type === 'line') {
        ctx.save();
        ctx.globalAlpha = r.alpha;
        ctx.beginPath(); ctx.moveTo(r.s1x, r.s1y); ctx.lineTo(r.s2x, r.s2y);
        ctx.strokeStyle = r.color; ctx.lineWidth = r.w * DPR;
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.stroke();
        ctx.restore();
      } else if (r.type === 'poly') {
        ctx.save();
        ctx.globalAlpha = r.alpha;
        ctx.beginPath(); ctx.moveTo(r.pxs[0], r.pys[0]);
        for(let i=1; i<4; i++) ctx.lineTo(r.pxs[i], r.pys[i]);
        ctx.fillStyle = r.color; ctx.fill();
        ctx.restore();
      } else if (r.type === 'sign') {
        const scale = focal / r.z * DPR;
        const fontSize = 2.2 * scale; 
        if (fontSize > 8) {
          const isMaru = r.text === '○';
          const signColor = isMaru ? '#dc2626' : '#374151';

          ctx.beginPath(); ctx.arc(r.px, r.py, fontSize * 0.75, 0, Math.PI*2);
          ctx.fillStyle = 'rgba(255, 255, 255, 0.95)'; ctx.fill();
          ctx.lineWidth = 3 * DPR;
          ctx.strokeStyle = signColor;
          ctx.stroke();
          
          ctx.font = `bold ${fontSize}px sans-serif`;
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillStyle = signColor;
          ctx.fillText(r.text, r.px, r.py);
        }
      }
    }

    drawExplosion();
    if (state.gameState === GAME_STATE.RUNNING || state.gameState === GAME_STATE.WAITING) {
      drawSpeedLines(state.speed / maxSpeed);
    }

    ctx.restore();

    if (flashAlpha > 0) {
      ctx.fillStyle = `rgba(255,225,180,${flashAlpha.toFixed(3)})`;
      ctx.fillRect(0, 0, W, H);
    }

    if (feedbackFlash > 0) {
      ctx.fillStyle = `rgba(${feedbackFlashColor},${(feedbackFlash * 0.32).toFixed(3)})`;
      ctx.fillRect(0, 0, W, H);
    }

    if (isFalling) {
      const vg = ctx.createRadialGradient(W/2, H/2, H*0.15, W/2, H/2, H*0.8);
      vg.addColorStop(0, 'rgba(0,0,0,0)');
      vg.addColorStop(1, `rgba(0,0,0,${(0.15 + state.fallProgress*0.55).toFixed(3)})`);
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
    }
  }

  resizeLeaves();
  initLeaves();
  requestAnimationFrame(leafFrame);

  seed();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
