<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Visualizer</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #111111;
    --fg-dim: #666666;
    --accent: #d4242c;
    --border: rgba(0,0,0,0.15);
    --border-strong: rgba(0,0,0,0.3);
    --hover: rgba(0,0,0,0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --fg: #f2f2f2;
      --fg-dim: #999999;
      --accent: #e63946;
      --border: rgba(255,255,255,0.15);
      --border-strong: rgba(255,255,255,0.3);
      --hover: rgba(255,255,255,0.05);
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    overflow: hidden;
  }
  #app {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    gap: 12px;
  }
  header h1 {
    font-size: 13px;
    font-weight: normal;
    letter-spacing: 0.12em;
    margin: 0;
    text-transform: uppercase;
    color: var(--fg-dim);
    flex-shrink: 0;
  }
  #trackInfo {
    display: flex;
    align-items: baseline;
    gap: 10px;
    max-width: 65%;
    overflow: hidden;
  }
  #trackCount {
    font-size: 11px;
    color: var(--fg-dim);
    flex-shrink: 0;
  }
  #trackName {
    font-size: 12px;
    color: var(--fg-dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #stage {
    position: relative;
    flex: 1;
    min-height: 0;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #dropHint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
    color: var(--fg-dim);
    font-size: 13px;
    letter-spacing: 0.05em;
    text-align: center;
  }
  #dropHint.hidden { display: none; }
  #dropHint b { color: var(--accent); font-weight: normal; }
  #dropHint .sub { font-size: 11px; }
  #stage.dragging {
    outline: 1px dashed var(--accent);
    outline-offset: -8px;
  }

  /* playlist drawer */
  #playlistPanel {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(320px, 88vw);
    background: var(--bg);
    border-left: 1px solid var(--border);
    transform: translateX(100%);
    transition: transform 0.18s ease;
    display: flex;
    flex-direction: column;
    z-index: 5;
  }
  #playlistPanel.open { transform: translateX(0); }
  .plHeader {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fg-dim);
    flex-shrink: 0;
  }
  .plClearBtn {
    text-transform: none;
    letter-spacing: normal;
    font-size: 11px;
    background: none;
    border: none;
    color: var(--fg-dim);
    cursor: pointer;
    font-family: inherit;
    padding: 2px 4px;
  }
  .plClearBtn:hover { color: var(--accent); }
  #playlistItems {
    flex: 1;
    overflow-y: auto;
  }
  .plItem {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 12px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    font-size: 12px;
  }
  .plItem:hover { background: var(--hover); }
  .plItem.playing {
    color: var(--accent);
    border-left: 2px solid var(--accent);
    padding-left: 10px;
  }
  .plItem.dragOver { border-top: 2px solid var(--accent); }
  .plIndex {
    color: var(--fg-dim);
    width: 20px;
    flex-shrink: 0;
    font-size: 11px;
  }
  .plItem.playing .plIndex { color: var(--accent); }
  .plName {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .plDuration {
    color: var(--fg-dim);
    font-size: 11px;
    flex-shrink: 0;
  }
  .plDelete {
    flex-shrink: 0;
    background: none;
    border: none;
    color: var(--fg-dim);
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    padding: 2px 4px;
    font-family: inherit;
  }
  .plDelete:hover { color: var(--accent); }
  .plEmpty {
    padding: 28px 16px;
    text-align: center;
    color: var(--fg-dim);
    font-size: 12px;
  }

  /* transport */
  #transport {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 18px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--fg-dim);
    flex-shrink: 0;
  }
  #seekBar { flex: 1; accent-color: var(--accent); }
  #seekBar:disabled { opacity: 0.35; }
  #curTime, #durTime { min-width: 32px; }
  #durTime { text-align: right; }

  footer {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 18px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .btnGroup { display: flex; gap: 4px; }
  button, .fileBtn {
    background: transparent;
    color: var(--fg);
    border: 1px solid var(--border-strong);
    padding: 8px 14px;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.04em;
    cursor: pointer;
    text-transform: uppercase;
  }
  button:hover, .fileBtn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  button:active, .fileBtn:active { opacity: 0.7; }
  button.active {
    border-color: var(--accent);
    color: var(--accent);
  }
  button:disabled {
    opacity: 0.35;
    cursor: default;
  }
  button:disabled:hover {
    border-color: var(--border-strong);
    color: var(--fg);
  }
  input[type=file] { display: none; }
  #spacer { flex: 1; }
  .volumeGroup {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--fg-dim);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  #volumeSlider { width: 70px; accent-color: var(--accent); }
  #status {
    font-size: 11px;
    color: var(--fg-dim);
    letter-spacing: 0.04em;
    min-width: 60px;
    text-align: right;
  }
  button:focus-visible, .fileBtn:focus-visible, input:focus-visible {
    outline: 1px solid var(--accent);
    outline-offset: 2px;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Music Visualizer</h1>
    <div id="trackInfo">
      <span id="trackCount"></span>
      <span id="trackName">未読み込み</span>
    </div>
  </header>

  <div id="stage">
    <canvas id="canvas"></canvas>
    <div id="dropHint">
      <div>ファイルをドラッグ&ドロップ、または<b>追加</b></div>
      <div class="sub">複数選択でプレイリストに追加されます</div>
      <div class="sub">マイク入力にも対応</div>
    </div>

    <div id="playlistPanel">
      <div class="plHeader">
        <span>プレイリスト (<span id="plCount">0</span>)</span>
        <button type="button" class="plClearBtn" id="plClearBtn">全て削除</button>
      </div>
      <div id="playlistItems"></div>
    </div>
  </div>

  <div id="transport">
    <span id="curTime">0:00</span>
    <input type="range" id="seekBar" min="0" max="100" value="0" step="0.1" disabled>
    <span id="durTime">0:00</span>
  </div>

  <footer>
    <label class="fileBtn" for="fileInput">追加</label>
    <input type="file" id="fileInput" accept="audio/*" multiple>

    <div class="btnGroup">
      <button id="prevBtn" disabled>前へ</button>
      <button id="playBtn" disabled>再生</button>
      <button id="nextBtn" disabled>次へ</button>
    </div>

    <button id="loopBtn" disabled>ループ: なし</button>
    <button id="micBtn">マイク</button>
    <button id="modeBtn">表示: 放射</button>
    <button id="plToggleBtn">プレイリスト</button>

    <div id="spacer"></div>

    <div class="volumeGroup">
      <span>音量</span>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1">
    </div>
    <div id="status">停止中</div>
  </footer>
</div>

<audio id="audioEl" style="display:none"></audio>

<script>
(function () {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const dropHint = document.getElementById('dropHint');
  const fileInput = document.getElementById('fileInput');
  const playBtn = document.getElementById('playBtn');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const loopBtn = document.getElementById('loopBtn');
  const micBtn = document.getElementById('micBtn');
  const modeBtn = document.getElementById('modeBtn');
  const plToggleBtn = document.getElementById('plToggleBtn');
  const plClearBtn = document.getElementById('plClearBtn');
  const playlistPanel = document.getElementById('playlistPanel');
  const playlistItemsEl = document.getElementById('playlistItems');
  const plCountEl = document.getElementById('plCount');
  const trackNameEl = document.getElementById('trackName');
  const trackCountEl = document.getElementById('trackCount');
  const statusEl = document.getElementById('status');
  const audioEl = document.getElementById('audioEl');
  const seekBar = document.getElementById('seekBar');
  const curTimeEl = document.getElementById('curTime');
  const durTimeEl = document.getElementById('durTime');
  const volumeSlider = document.getElementById('volumeSlider');

  let audioCtx = null;
  let analyser = null;
  let audioSourceNode = null;
  let micSourceNode = null;
  let dataArray = null;
  let bufferLength = 0;
  let rafId = null;
  let micStream = null;
  let usingMic = false;

  let playlist = [];
  let currentIndex = -1;
  let trackIdSeq = 0;
  let dragSrcIndex = null;
  let isSeeking = false;

  const loopOrder = ['off', 'one', 'all'];
  const loopLabels = { off: 'ループ: なし', one: 'ループ: 1曲', all: 'ループ: 全曲' };
  let loopMode = 'off';

  const modes = ['radial', 'bars', 'wave'];
  const modeLabels = { radial: '放射', bars: 'バー', wave: '波形' };
  let modeIndex = 0;

  function resizeCanvas() {
    const rect = stage.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function getColors() {
    const cs = getComputedStyle(document.documentElement);
    return {
      bg: cs.getPropertyValue('--bg').trim(),
      accent: cs.getPropertyValue('--accent').trim(),
      fg: cs.getPropertyValue('--fg').trim()
    };
  }

  function formatTime(sec) {
    if (!isFinite(sec) || isNaN(sec) || sec < 0) return '0:00';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60).toString().padStart(2, '0');
    return m + ':' + s;
  }

  // ---- audio graph ----
  function ensureAudioContext() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024;
      analyser.smoothingTimeConstant = 0.8;
      bufferLength = analyser.frequencyBinCount;
      dataArray = new Uint8Array(bufferLength);

      // created once for the lifetime of audioEl; switching tracks only changes audioEl.src
      audioSourceNode = audioCtx.createMediaElementSource(audioEl);
      audioSourceNode.connect(analyser);
      analyser.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  // ---- playlist ----
  function addTracks(fileList) {
    const files = Array.from(fileList).filter(f => f.type.startsWith('audio/'));
    if (!files.length) return;
    const wasEmpty = playlist.length === 0;
    const newTracks = files.map(f => ({
      id: 't' + (trackIdSeq++),
      file: f,
      url: URL.createObjectURL(f),
      name: f.name,
      duration: null
    }));
    playlist.push(...newTracks);
    dropHint.classList.add('hidden');
    renderPlaylist();
    newTracks.forEach(loadTrackDuration);
    updateTransportAvailability();
    if (wasEmpty) playTrackAt(0);
  }

  function loadTrackDuration(track) {
    const probe = new Audio();
    probe.preload = 'metadata';
    probe.src = track.url;
    probe.addEventListener('loadedmetadata', () => {
      track.duration = probe.duration;
      const row = playlistItemsEl.querySelector('[data-id="' + track.id + '"] .plDuration');
      if (row) row.textContent = formatTime(track.duration);
    });
  }

  function renderPlaylist() {
    playlistItemsEl.innerHTML = '';
    plCountEl.textContent = playlist.length;

    if (playlist.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'plEmpty';
      empty.textContent = '曲がありません';
      playlistItemsEl.appendChild(empty);
      return;
    }

    playlist.forEach((track, i) => {
      const li = document.createElement('div');
      li.className = 'plItem' + (i === currentIndex ? ' playing' : '');
      li.draggable = true;
      li.dataset.id = track.id;

      const idx = document.createElement('span');
      idx.className = 'plIndex';
      idx.textContent = String(i + 1).padStart(2, '0');

      const name = document.createElement('span');
      name.className = 'plName';
      name.textContent = track.name;

      const dur = document.createElement('span');
      dur.className = 'plDuration';
      dur.textContent = track.duration ? formatTime(track.duration) : '--:--';

      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'plDelete';
      del.textContent = '\u00d7';
      del.setAttribute('aria-label', '削除');
      del.addEventListener('click', (e) => {
        e.stopPropagation();
        removeTrackAt(i);
      });

      li.appendChild(idx);
      li.appendChild(name);
      li.appendChild(dur);
      li.appendChild(del);

      li.addEventListener('click', () => playTrackAt(i));

      li.addEventListener('dragstart', (e) => {
        dragSrcIndex = i;
        e.dataTransfer.effectAllowed = 'move';
      });
      li.addEventListener('dragover', (e) => {
        e.preventDefault();
        li.classList.add('dragOver');
      });
      li.addEventListener('dragleave', () => {
        li.classList.remove('dragOver');
      });
      li.addEventListener('drop', (e) => {
        e.preventDefault();
        li.classList.remove('dragOver');
        if (dragSrcIndex === null || dragSrcIndex === i) return;
        reorderPlaylist(dragSrcIndex, i);
        dragSrcIndex = null;
      });
      li.addEventListener('dragend', () => {
        li.classList.remove('dragOver');
        dragSrcIndex = null;
      });

      playlistItemsEl.appendChild(li);
    });
  }

  function reorderPlaylist(from, to) {
    const item = playlist.splice(from, 1)[0];
    playlist.splice(to, 0, item);
    if (currentIndex === from) currentIndex = to;
    else if (from < currentIndex && to >= currentIndex) currentIndex--;
    else if (from > currentIndex && to <= currentIndex) currentIndex++;
    renderPlaylist();
    if (currentIndex >= 0) {
      trackCountEl.textContent = String(currentIndex + 1).padStart(2, '0') + ' / ' + String(playlist.length).padStart(2, '0');
    }
  }

  function removeTrackAt(index) {
    const wasCurrent = index === currentIndex;
    URL.revokeObjectURL(playlist[index].url);
    playlist.splice(index, 1);

    if (index < currentIndex) {
      currentIndex--;
    } else if (wasCurrent) {
      if (playlist.length === 0) {
        currentIndex = -1;
        stopAllPlayback();
      } else {
        playTrackAt(Math.min(index, playlist.length - 1));
      }
    }

    renderPlaylist();
    updateTransportAvailability();
    if (playlist.length === 0) dropHint.classList.remove('hidden');
  }

  function clearPlaylist() {
    playlist.forEach(t => URL.revokeObjectURL(t.url));
    playlist = [];
    currentIndex = -1;
    stopAllPlayback();
    renderPlaylist();
    updateTransportAvailability();
    dropHint.classList.remove('hidden');
  }

  function updateTransportAvailability() {
    const hasMultiple = playlist.length > 1;
    prevBtn.disabled = usingMic || !hasMultiple;
    nextBtn.disabled = usingMic || !hasMultiple;
    loopBtn.disabled = usingMic || playlist.length === 0;
    seekBar.disabled = usingMic || playlist.length === 0;
  }

  // ---- playback ----
  function playTrackAt(index) {
    if (index < 0 || index >= playlist.length) return;
    if (usingMic) stopMic();
    ensureAudioContext();

    currentIndex = index;
    const track = playlist[index];
    audioEl.src = track.url;
    trackNameEl.textContent = track.name;
    trackCountEl.textContent = String(index + 1).padStart(2, '0') + ' / ' + String(playlist.length).padStart(2, '0');
    dropHint.classList.add('hidden');

    playBtn.disabled = false;
    const p = audioEl.play();
    if (p && p.catch) p.catch(() => {});
    playBtn.textContent = '一時停止';
    statusEl.textContent = '再生中';

    renderPlaylist();
    updateTransportAvailability();
    startDraw();
  }

  function stopAllPlayback() {
    audioEl.pause();
    audioEl.removeAttribute('src');
    audioEl.load();
    trackNameEl.textContent = '未読み込み';
    trackCountEl.textContent = '';
    playBtn.textContent = '再生';
    playBtn.disabled = true;
    statusEl.textContent = '停止中';
    seekBar.value = 0;
    seekBar.max = 100;
    curTimeEl.textContent = '0:00';
    durTimeEl.textContent = '0:00';
    stopDraw();
  }

  fileInput.addEventListener('change', (e) => {
    addTracks(e.target.files);
    fileInput.value = '';
  });

  playBtn.addEventListener('click', () => {
    if (!audioEl.src) return;
    ensureAudioContext();
    if (audioEl.paused) {
      audioEl.play();
      playBtn.textContent = '一時停止';
      statusEl.textContent = '再生中';
    } else {
      audioEl.pause();
      playBtn.textContent = '再生';
      statusEl.textContent = '一時停止中';
    }
  });

  prevBtn.addEventListener('click', () => {
    if (playlist.length === 0) return;
    playTrackAt((currentIndex - 1 + playlist.length) % playlist.length);
  });
  nextBtn.addEventListener('click', () => {
    if (playlist.length === 0) return;
    playTrackAt((currentIndex + 1) % playlist.length);
  });

  loopBtn.addEventListener('click', () => {
    const i = loopOrder.indexOf(loopMode);
    loopMode = loopOrder[(i + 1) % loopOrder.length];
    loopBtn.textContent = loopLabels[loopMode];
    loopBtn.classList.toggle('active', loopMode !== 'off');
  });

  audioEl.addEventListener('ended', () => {
    if (loopMode === 'one') {
      audioEl.currentTime = 0;
      audioEl.play();
      return;
    }
    if (playlist.length === 0) return;
    let next = currentIndex + 1;
    if (next >= playlist.length) {
      if (loopMode === 'all') {
        next = 0;
      } else {
        playBtn.textContent = '再生';
        statusEl.textContent = '終了';
        return;
      }
    }
    playTrackAt(next);
  });

  audioEl.addEventListener('loadedmetadata', () => {
    seekBar.max = isFinite(audioEl.duration) ? audioEl.duration : 100;
    durTimeEl.textContent = formatTime(audioEl.duration);
  });

  audioEl.addEventListener('timeupdate', () => {
    if (isSeeking) return;
    seekBar.value = audioEl.currentTime;
    curTimeEl.textContent = formatTime(audioEl.currentTime);
  });

  seekBar.addEventListener('input', () => {
    isSeeking = true;
    curTimeEl.textContent = formatTime(parseFloat(seekBar.value));
  });
  seekBar.addEventListener('change', () => {
    audioEl.currentTime = parseFloat(seekBar.value);
    isSeeking = false;
  });

  volumeSlider.addEventListener('input', () => {
    audioEl.volume = parseFloat(volumeSlider.value);
  });

  // ---- mic ----
  micBtn.addEventListener('click', async () => {
    if (usingMic) {
      stopMic();
      if (playlist.length === 0) {
        statusEl.textContent = '停止中';
        stopDraw();
      } else {
        statusEl.textContent = audioEl.paused ? '一時停止中' : '再生中';
      }
      return;
    }
    try {
      ensureAudioContext();
      audioEl.pause();
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      micSourceNode = audioCtx.createMediaStreamSource(micStream);
      micSourceNode.connect(analyser);
      usingMic = true;
      micBtn.classList.add('active');
      trackNameEl.textContent = 'マイク入力';
      trackCountEl.textContent = '';
      dropHint.classList.add('hidden');
      statusEl.textContent = '入力中';
      updateTransportAvailability();
      startDraw();
    } catch (err) {
      statusEl.textContent = 'マイク不可';
    }
  });

  function stopMic() {
    if (micStream) {
      micStream.getTracks().forEach(t => t.stop());
      micStream = null;
    }
    if (micSourceNode) {
      try { micSourceNode.disconnect(); } catch (e) {}
      micSourceNode = null;
    }
    usingMic = false;
    micBtn.classList.remove('active');
    updateTransportAvailability();
    if (currentIndex >= 0 && playlist[currentIndex]) {
      trackNameEl.textContent = playlist[currentIndex].name;
      trackCountEl.textContent = String(currentIndex + 1).padStart(2, '0') + ' / ' + String(playlist.length).padStart(2, '0');
    } else {
      trackNameEl.textContent = '未読み込み';
    }
  }

  // ---- display mode ----
  modeBtn.addEventListener('click', () => {
    modeIndex = (modeIndex + 1) % modes.length;
    modeBtn.textContent = '表示: ' + modeLabels[modes[modeIndex]];
  });

  // ---- playlist panel ----
  plToggleBtn.addEventListener('click', () => {
    const open = playlistPanel.classList.toggle('open');
    plToggleBtn.classList.toggle('active', open);
  });
  plClearBtn.addEventListener('click', clearPlaylist);

  // ---- drag & drop (external files only; internal reorder uses the same events on list items) ----
  function isFileDrag(e) {
    return e.dataTransfer && Array.from(e.dataTransfer.types).includes('Files');
  }
  ['dragenter', 'dragover'].forEach(evt => {
    stage.addEventListener(evt, (e) => {
      if (!isFileDrag(e)) return;
      e.preventDefault();
      stage.classList.add('dragging');
    });
  });
  ['dragleave', 'drop'].forEach(evt => {
    stage.addEventListener(evt, (e) => {
      if (!isFileDrag(e)) return;
      e.preventDefault();
      stage.classList.remove('dragging');
    });
  });
  stage.addEventListener('drop', (e) => {
    if (!isFileDrag(e)) return;
    addTracks(e.dataTransfer.files);
  });

  // ---- keyboard ----
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (playlistPanel.classList.contains('open')) {
        playlistPanel.classList.remove('open');
        plToggleBtn.classList.remove('active');
      }
      return;
    }
    if (e.code === 'Space') {
      const tag = document.activeElement.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'BUTTON') return;
      if (playBtn.disabled) return;
      e.preventDefault();
      playBtn.click();
    }
  });

  // ---- drawing ----
  function startDraw() {
    if (rafId) cancelAnimationFrame(rafId);
    draw();
  }
  function stopDraw() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    const rect = stage.getBoundingClientRect();
    ctx.clearRect(0, 0, rect.width, rect.height);
  }

  function draw() {
    rafId = requestAnimationFrame(draw);
    const rect = stage.getBoundingClientRect();
    const w = rect.width, h = rect.height;
    const colors = getColors();

    analyser.getByteFrequencyData(dataArray);

    ctx.fillStyle = colors.bg;
    ctx.globalAlpha = 1;
    ctx.fillRect(0, 0, w, h);

    const mode = modes[modeIndex];
    if (mode === 'bars') drawBars(w, h, colors);
    else if (mode === 'wave') drawWave(w, h, colors);
    else drawRadial(w, h, colors);
  }

  function drawBars(w, h, colors) {
    const barCount = 64;
    const step = Math.floor(bufferLength / barCount);
    const barWidth = w / barCount;
    ctx.fillStyle = colors.accent;
    for (let i = 0; i < barCount; i++) {
      const v = dataArray[i * step] / 255;
      const barHeight = v * h * 0.9;
      ctx.fillRect(i * barWidth + 1, h - barHeight, barWidth - 2, barHeight);
    }
  }

  function drawWave(w, h, colors) {
    const timeData = new Uint8Array(bufferLength);
    analyser.getByteTimeDomainData(timeData);
    ctx.strokeStyle = colors.accent;
    ctx.lineWidth = 2;
    ctx.beginPath();
    const sliceWidth = w / bufferLength;
    let x = 0;
    for (let i = 0; i < bufferLength; i++) {
      const v = timeData[i] / 128.0;
      const y = (v * h) / 2;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
      x += sliceWidth;
    }
    ctx.stroke();
  }

  function drawRadial(w, h, colors) {
    const cx = w / 2, cy = h / 2;
    const baseRadius = Math.min(w, h) * 0.18;
    const barCount = 96;
    const step = Math.floor(bufferLength / barCount);

    let sum = 0;
    for (let i = 0; i < bufferLength; i++) sum += dataArray[i];
    const avg = sum / bufferLength / 255;

    ctx.fillStyle = colors.accent;
    ctx.beginPath();
    ctx.arc(cx, cy, baseRadius * (0.9 + avg * 0.3), 0, Math.PI * 2);
    ctx.fill();

    for (let i = 0; i < barCount; i++) {
      const v = dataArray[i * step] / 255;
      const angle = (i / barCount) * Math.PI * 2 - Math.PI / 2;
      const r1 = baseRadius;
      const r2 = baseRadius + v * Math.min(w, h) * 0.32;
      const x1 = cx + Math.cos(angle) * r1;
      const y1 = cy + Math.sin(angle) * r1;
      const x2 = cx + Math.cos(angle) * r2;
      const y2 = cy + Math.sin(angle) * r2;
      ctx.beginPath();
      ctx.lineWidth = Math.max(1.5, (Math.PI * 2 * baseRadius / barCount) * 0.6);
      ctx.strokeStyle = colors.accent;
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }
  }

  // ---- init ----
  renderPlaylist();
  updateTransportAvailability();
})();
</script>
</body>
</html>
