<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>メディアプレイヤ</title>
<style>
    :root {
        --bg: #0a0a0a;
        --panel: #161616;
        --panel2: #202020;
        --border: #333333;
        --border-light: #444444;
        --accent: #ff3b3b;
        --accent-dim: #b32424;
        --on-accent: #ffffff;
        --text: #e8e8e8;
        --text-muted: #999999;
        --text-faint: #666666;
        --danger: #ff6b6b;
        --success: #6bcf6b;
        --info: #7ec8ff;
    }

    [data-theme="light"] {
        --bg: #ffffff;
        --panel: #f7f7f7;
        --panel2: #eeeeee;
        --border: #dddddd;
        --border-light: #cccccc;
        --accent: #e02424;
        --accent-dim: #a81b1b;
        --on-accent: #ffffff;
        --text: #1a1a1a;
        --text-muted: #666666;
        --text-faint: #999999;
        --danger: #d62828;
        --success: #2e7d32;
        --info: #1565c0;
    }

    * { box-sizing: border-box; }

    body {
        background: var(--bg);
        color: var(--text);
        font-family: 'Roboto Mono', 'Consolas', monospace;
        margin: 0;
        padding: 12px;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        transition: background-color 0.2s, color 0.2s;
    }

    #container {
        position: relative;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 20px;
        max-width: 1200px;
        width: 100%;
        margin-top: 10px;
        overflow: hidden;
        transition: background-color 0.2s, border-color 0.2s;
    }

    @media (min-width: 768px) {
        #container { padding: 28px; margin-top: 24px; }
    }

    #ring-deco {
        position: absolute;
        top: -60px;
        right: -60px;
        width: 160px;
        height: 160px;
        pointer-events: none;
        opacity: 0.35;
    }
    #ring-deco circle { fill: var(--accent); }

    h1 {
        position: relative;
        z-index: 1;
        font-size: 1.25em;
        margin: 0 0 6px 0;
        color: var(--accent);
        font-weight: 500;
        letter-spacing: 0.02em;
    }

    @media (min-width: 768px) {
        h1 { font-size: 1.6em; margin-bottom: 8px; }
    }

    .counter-link { display: inline-block; margin-bottom: 16px; line-height: 0; opacity: 0.85; transition: opacity 0.15s; }
    .counter-link:hover { opacity: 1; }
    .counter-link img { display: block; border-radius: 3px; }

    h2 {
        font-size: 13px;
        color: var(--accent);
        font-weight: 500;
        margin: 0 0 14px 0;
        letter-spacing: 0.02em;
    }

    .layout {
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    @media (min-width: 900px) {
        .layout { flex-direction: row; align-items: flex-start; }
        .left-panel { flex: 1; min-width: 300px; }
        .right-panel { flex: 2; min-width: 0; }
    }

    .section {
        background-color: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 14px;
    }

    input[type="text"] {
        width: 100%;
        padding: 13px 14px;
        background-color: var(--panel);
        color: var(--text);
        border: 1px solid var(--border-light);
        border-radius: 6px;
        font-size: 14px;
        font-family: inherit;
        min-width: 0;
        transition: border-color 0.15s;
    }
    input[type="text"]:focus { outline: none; border-color: var(--accent); }
    input[type="text"]::placeholder { color: var(--text-faint); }

    input[type="file"] { display: none; }

    .file-label {
        display: block;
        text-align: center;
        padding: 12px;
        background-color: var(--panel);
        color: var(--text-muted);
        border: 1px solid var(--border-light);
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        transition: all 0.15s;
    }
    .file-label:hover { color: var(--text); border-color: var(--accent); }

    .drop-zone {
        border: 1px dashed var(--border-light);
        padding: 28px 16px;
        text-align: center;
        color: var(--text-faint);
        border-radius: 6px;
        font-size: 12.5px;
        margin-top: 10px;
        transition: all 0.15s;
    }
    .drop-zone.drag-over { border-color: var(--accent); color: var(--accent); background-color: var(--panel); }

    .row { display: flex; gap: 8px; margin-top: 10px; }
    .row input[type="text"] { margin: 0; }

    button {
        background-color: var(--accent);
        color: var(--on-accent);
        border: none;
        padding: 10px 16px;
        font-size: 13px;
        border-radius: 6px;
        cursor: pointer;
        font-family: inherit;
        transition: all 0.15s;
        font-weight: 500;
        white-space: nowrap;
    }
    button:hover:not(:disabled) { background-color: var(--accent-dim); }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { background-color: var(--border-light); color: var(--text-faint); cursor: not-allowed; }

    button.secondary {
        background-color: var(--panel);
        color: var(--text-muted);
        border: 1px solid var(--border-light);
        width: 100%;
        margin-top: 10px;
    }
    button.secondary:hover:not(:disabled) { color: var(--text); background-color: var(--panel2); }

    .status-log {
        background-color: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 10px 12px;
        margin-top: 12px;
        max-height: 90px;
        overflow-y: auto;
        font-size: 11.5px;
        line-height: 1.8;
        scrollbar-width: thin;
        scrollbar-color: var(--border-light) var(--bg);
    }
    .status-log:empty { display: none; }
    .status-log::-webkit-scrollbar { width: 6px; }
    .status-log::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }

    .log-entry {
        display: flex;
        align-items: baseline;
        gap: 7px;
        color: var(--text-muted);
        white-space: pre-wrap;
        word-break: break-all;
    }
    .log-dot {
        flex-shrink: 0;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--text-faint);
        margin-top: 2px;
    }
    .log-entry.success .log-dot { background: var(--success); }
    .log-entry.error .log-dot { background: var(--danger); }
    .log-entry.success { color: var(--success); }
    .log-entry.error { color: var(--danger); }

    .playlist { max-height: 420px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border-light) var(--panel2); }
    .playlist::-webkit-scrollbar { width: 6px; }
    .playlist::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }
    .playlist-empty { color: var(--text-faint); text-align: center; padding: 20px; font-size: 12.5px; }

    .playlist-item {
        background-color: var(--panel);
        border: 1px solid var(--border);
        border-left: 3px solid transparent;
        padding: 10px 12px;
        margin-bottom: 8px;
        border-radius: 6px;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        transition: all 0.15s;
    }
    .playlist-item:hover { border-color: var(--border-light); }
    .playlist-item.active { border-left-color: var(--accent); background-color: var(--panel2); }
    .playlist-item-info { flex: 1; min-width: 0; }
    .playlist-item-name { color: var(--text); font-size: 13px; margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .playlist-item-meta { color: var(--text-faint); font-size: 11px; }
    .playlist-item-remove {
        background: transparent;
        color: var(--text-faint);
        border: 1px solid var(--border-light);
        padding: 5px 10px;
        font-size: 11px;
        border-radius: 4px;
    }
    .playlist-item-remove:hover:not(:disabled) { background: transparent; color: var(--danger); border-color: var(--danger); }

    .view-area {
        position: relative;
        background-color: var(--panel);
        border: 1px solid var(--border-light);
        border-radius: 6px;
        min-height: 320px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .view-area.is-fullscreen {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        z-index: 1000;
        background-color: var(--bg);
        border-radius: 0;
        padding: 16px;
    }

    #preview { max-width: 100%; max-height: 60vh; display: block; border-radius: 4px; background: #000; }
    .view-area.is-fullscreen #preview { max-height: calc(100vh - 32px); max-width: calc(100vw - 32px); }

    .placeholder { color: var(--text-faint); font-size: 12.5px; }

    .fullscreen-btn {
        position: absolute;
        top: 8px;
        right: 8px;
        z-index: 2;
        background-color: var(--panel2);
        color: var(--text-muted);
        border: 1px solid var(--border-light);
        padding: 6px 10px;
        font-size: 11px;
        border-radius: 5px;
        opacity: 0.85;
    }
    .fullscreen-btn:hover:not(:disabled) { color: var(--text); background-color: var(--panel); opacity: 1; }

    .controls { display: none; flex-wrap: wrap; gap: 16px; margin-top: 14px; padding: 12px 14px; background-color: var(--panel2); border: 1px solid var(--border); border-radius: 6px; }
    .control-group { display: flex; align-items: center; gap: 8px; }
    .control-group label { font-size: 12px; color: var(--text-muted); }
    .control-group span { font-size: 12px; color: var(--text-faint); min-width: 38px; }

    input[type="range"] {
        width: 110px;
        height: 3px;
        background: var(--border-light);
        border-radius: 2px;
        outline: none;
        -webkit-appearance: none;
    }
    input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 13px; height: 13px;
        background: var(--accent);
        border-radius: 50%;
        cursor: pointer;
    }
    input[type="range"]::-moz-range-thumb {
        width: 13px; height: 13px;
        background: var(--accent);
        border-radius: 50%;
        cursor: pointer;
        border: none;
    }
    input[type="checkbox"] { width: 15px; height: 15px; cursor: pointer; accent-color: var(--accent); }

    .info-box { background-color: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; font-size: 12.5px; line-height: 1.9; }
    .info-box div { display: flex; gap: 8px; }
    .info-box span.label { color: var(--accent); flex-shrink: 0; }
    .info-box .val { color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<div id="container">
    <svg id="ring-deco" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
        <circle cx="80" cy="80" r="3" fill-opacity="1"/>
        <circle cx="80" cy="40" r="3" fill-opacity="0.9"/>
        <circle cx="112" cy="52" r="3" fill-opacity="0.8"/>
        <circle cx="120" cy="80" r="3" fill-opacity="0.7"/>
        <circle cx="112" cy="108" r="3" fill-opacity="0.6"/>
        <circle cx="80" cy="120" r="3" fill-opacity="0.5"/>
        <circle cx="48" cy="108" r="3" fill-opacity="0.4"/>
        <circle cx="40" cy="80" r="3" fill-opacity="0.3"/>
        <circle cx="48" cy="52" r="3" fill-opacity="0.2"/>
        <circle cx="80" cy="80" r="60" fill="none" stroke="var(--accent)" stroke-width="1" stroke-opacity="0.15"/>
        <circle cx="80" cy="80" r="30" fill="none" stroke="var(--accent)" stroke-width="1" stroke-opacity="0.15"/>
    </svg>

    <h1>メディアプレイヤ</h1>
    <a class="counter-link" href="/index"><img src="https://counter.256server.com/ms0101?theme=moebooru" alt="アクセスカウンタ" width="200" height="65"></a>

    <div class="layout">
        <div class="left-panel">
            <div class="section">
                <h2>エクスプローラーから追加</h2>
                <label class="file-label" for="fileInput">クリックしてファイルを選択</label>
                <input id="fileInput" type="file" accept="video/*,audio/*,image/*" multiple>
                <div class="drop-zone" id="dropZone">ここにファイルをドラッグ&ドロップ</div>
            </div>
            <div class="section">
                <h2>URLから追加</h2>
                <div class="row">
                    <input id="urlInput" type="text" placeholder="https://example.com/video.mp4">
                    <button id="loadUrlBtn">追加</button>
                </div>
            </div>
            <div class="section">
                <h2>プレイリスト</h2>
                <div class="playlist" id="playlist"></div>
                <button class="secondary" id="clearPlaylistBtn">すべて削除</button>
                <div class="status-log" id="statusLog"></div>
            </div>
        </div>

        <div class="right-panel">
            <div class="section">
                <h2>再生エリア</h2>
                <div class="view-area" id="viewArea">
                    <button class="fullscreen-btn" id="fullscreenBtn" style="display:none;">全画面</button>
                    <div id="previewArea"><div class="placeholder" id="placeholder">プレイリストからメディアを選択してください</div></div>
                </div>
                <div class="controls" id="controls">
                    <div class="control-group"><label>再生速度</label><input type="range" id="speedControl" min="0.25" max="2" step="0.25" value="1"><span id="speedValue">1.0x</span></div>
                    <div class="control-group"><label>音量</label><input type="range" id="volumeControl" min="0" max="1" step="0.1" value="1"><span id="volumeValue">100%</span></div>
                    <div class="control-group"><label>ループ</label><input type="checkbox" id="loopControl"></div>
                </div>
            </div>
            <div class="section" id="infoSection" style="display:none;">
                <h2>ファイル情報</h2>
                <div class="info-box" id="fileInfo"></div>
            </div>
        </div>
    </div>
</div>

<script>
    // ---- テーマ（システム設定に自動追従） ----
    (function initTheme() {
        const root = document.documentElement;
        const mql = window.matchMedia('(prefers-color-scheme: light)');
        function applyTheme() { root.setAttribute('data-theme', mql.matches ? 'light' : 'dark'); }
        applyTheme();
        mql.addEventListener('change', applyTheme);
    })();

    let playlist = [], currentIndex = -1, currentMedia = null;

    const formatFileSize = b => b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(1) + ' KB' : (b / 1048576).toFixed(1) + ' MB';
    const formatDuration = s => !s || !isFinite(s) ? '--:--' : `${Math.floor(s / 60)}:${Math.floor(s % 60).toString().padStart(2, '0')}`;

    function getMediaType(url, type) {
        const l = url.toLowerCase(), t = type.toLowerCase();
        if (l.match(/\.(mp4|webm|mov|avi|mkv|flv)$/) || t.startsWith('video/')) return 'video';
        if (l.match(/\.(mp3|wav|m4a|ogg|flac|aac)$/) || t.startsWith('audio/')) return 'audio';
        if (l.match(/\.(png|jpg|jpeg|gif|bmp|webp|svg|ico)$/) || t.startsWith('image/')) return 'image';
        return 'unknown';
    }

    function addToPlaylist(url, name, size, type) {
        playlist.push({ url, name, size, type, mediaType: getMediaType(url, type) });
        updatePlaylistUI();
        if (playlist.length === 1) playMedia(0);
    }

    function updatePlaylistUI() {
        const el = document.getElementById('playlist');
        if (!playlist.length) { el.innerHTML = "<div class='playlist-empty'>プレイリストは空です</div>"; return; }
        el.innerHTML = playlist.map((item, i) => `
            <div class="playlist-item ${i === currentIndex ? 'active' : ''}" onclick="playMedia(${i})">
                <div class="playlist-item-info">
                    <div class="playlist-item-name">${escapeHtml(item.name)}</div>
                    <div class="playlist-item-meta">${item.mediaType.toUpperCase()}${item.size ? ' - ' + formatFileSize(item.size) : ''}</div>
                </div>
                <button class="playlist-item-remove" onclick="event.stopPropagation();removeFromPlaylist(${i})">削除</button>
            </div>`).join('');
    }

    function escapeHtml(s) {
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    function removeFromPlaylist(i) {
        if (i === currentIndex) {
            document.getElementById('previewArea').innerHTML = '<div class="placeholder" id="placeholder">プレイリストからメディアを選択してください</div>';
            document.getElementById('controls').style.display = 'none';
            document.getElementById('infoSection').style.display = 'none';
            document.getElementById('fullscreenBtn').style.display = 'none';
            currentMedia = null;
            currentIndex = -1;
        } else if (i < currentIndex) {
            currentIndex--;
        }
        playlist.splice(i, 1);
        updatePlaylistUI();
    }

    function playMedia(i) {
        if (i < 0 || i >= playlist.length) return;
        currentIndex = i;
        const item = playlist[i];
        const area = document.getElementById('previewArea');
        area.innerHTML = '';
        const c = document.getElementById('controls');
        const info = document.getElementById('infoSection');
        const fsBtn = document.getElementById('fullscreenBtn');

        if (item.mediaType === 'video') {
            const v = document.createElement('video');
            v.src = item.url; v.controls = true; v.autoplay = true; v.id = 'preview';
            area.appendChild(v); currentMedia = v;
            c.style.display = 'flex'; fsBtn.style.display = 'block';
            setupMediaControls(v);
            v.addEventListener('loadedmetadata', () => updateFileInfo(item, v.duration));
            v.addEventListener('ended', () => { if (!v.loop) playMedia(currentIndex < playlist.length - 1 ? currentIndex + 1 : 0); });
        } else if (item.mediaType === 'audio') {
            const a = document.createElement('audio');
            a.src = item.url; a.controls = true; a.autoplay = true; a.id = 'preview'; a.style.width = '100%';
            area.appendChild(a); currentMedia = a;
            c.style.display = 'flex'; fsBtn.style.display = 'none';
            setupMediaControls(a);
            a.addEventListener('loadedmetadata', () => updateFileInfo(item, a.duration));
            a.addEventListener('ended', () => { if (!a.loop) playMedia(currentIndex < playlist.length - 1 ? currentIndex + 1 : 0); });
        } else if (item.mediaType === 'image') {
            const img = document.createElement('img');
            img.src = item.url; img.id = 'preview';
            area.appendChild(img); currentMedia = null;
            c.style.display = 'none'; fsBtn.style.display = 'block';
            updateFileInfo(item);
        } else {
            area.innerHTML = "<div class='placeholder'>この形式は再生できません</div>";
            c.style.display = 'none'; info.style.display = 'none'; fsBtn.style.display = 'none';
            currentMedia = null;
            addLog(`${item.name}: 非対応の形式です`, 'error');
        }
        updatePlaylistUI();
    }

    function setupMediaControls(m) {
        const s = document.getElementById('speedControl'), sv = document.getElementById('speedValue');
        const v = document.getElementById('volumeControl'), vv = document.getElementById('volumeValue');
        const l = document.getElementById('loopControl');
        s.value = m.playbackRate; sv.textContent = m.playbackRate.toFixed(1) + 'x';
        v.value = m.volume; vv.textContent = Math.round(m.volume * 100) + '%';
        l.checked = m.loop;
        s.oninput = e => { m.playbackRate = e.target.value; sv.textContent = parseFloat(e.target.value).toFixed(1) + 'x'; };
        v.oninput = e => { m.volume = e.target.value; vv.textContent = Math.round(e.target.value * 100) + '%'; };
        l.onchange = e => m.loop = e.target.checked;
    }

    function updateFileInfo(item, d = null) {
        const info = document.getElementById('infoSection'), box = document.getElementById('fileInfo');
        info.style.display = 'block';
        let h = `<div><span class="label">ファイル名:</span><span class="val">${escapeHtml(item.name)}</span></div>`;
        h += `<div><span class="label">形式:</span><span class="val">${item.mediaType.toUpperCase()}</span></div>`;
        if (item.size) h += `<div><span class="label">サイズ:</span><span class="val">${formatFileSize(item.size)}</span></div>`;
        if (d) h += `<div><span class="label">再生時間:</span><span class="val">${formatDuration(d)}</span></div>`;
        if (item.type) h += `<div><span class="label">MIME:</span><span class="val">${item.type}</span></div>`;
        box.innerHTML = h;
    }

    document.getElementById('fileInput').addEventListener('change', e => {
        Array.from(e.target.files).forEach(f => addToPlaylist(URL.createObjectURL(f), f.name, f.size, f.type));
        e.target.value = '';
    });

    const dropZone = document.getElementById('dropZone');
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', e => {
        e.preventDefault(); dropZone.classList.remove('drag-over');
        Array.from(e.dataTransfer.files).forEach(f => addToPlaylist(URL.createObjectURL(f), f.name, f.size, f.type));
    });

    document.getElementById('urlInput').addEventListener('keypress', e => { if (e.key === 'Enter') loadFromUrl(); });
    document.getElementById('loadUrlBtn').addEventListener('click', loadFromUrl);

    async function loadFromUrl() {
        const input = document.getElementById('urlInput');
        const url = input.value.trim();
        if (!url) { addLog('URLを入力してください', 'error'); return; }
        addLog(`取得中: ${url}`, 'info');
        try {
            const r = await fetch(url);
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            const b = await r.blob();
            addToPlaylist(URL.createObjectURL(b), url.split('/').pop() || 'media', b.size, b.type);
            addLog('追加しました', 'success');
            input.value = '';
        } catch (e) {
            addLog(`取得失敗: ${e.message}`, 'error');
        }
    }

    document.getElementById('clearPlaylistBtn').addEventListener('click', () => {
        if (!playlist.length) return;
        if (!confirm('プレイリストをすべて削除しますか?')) return;
        playlist = []; currentIndex = -1; currentMedia = null;
        document.getElementById('previewArea').innerHTML = '<div class="placeholder" id="placeholder">プレイリストからメディアを選択してください</div>';
        document.getElementById('controls').style.display = 'none';
        document.getElementById('infoSection').style.display = 'none';
        document.getElementById('fullscreenBtn').style.display = 'none';
        updatePlaylistUI();
    });

    // ---- ステータスログ ----
    function addLog(message, type = 'info') {
        const log = document.getElementById('statusLog');
        const entry = document.createElement('div');
        entry.className = `log-entry ${type}`;
        entry.innerHTML = `<span class="log-dot"></span><span class="log-text"></span>`;
        entry.querySelector('.log-text').textContent = message;
        log.appendChild(entry);
        log.scrollTop = log.scrollHeight;
        while (log.children.length > 6) log.removeChild(log.firstChild);
    }

    // ---- 全画面表示（Fullscreen API不使用） ----
    document.getElementById('fullscreenBtn').addEventListener('click', toggleFullscreen);
    function toggleFullscreen() {
        const area = document.getElementById('viewArea');
        const btn = document.getElementById('fullscreenBtn');
        const active = area.classList.toggle('is-fullscreen');
        btn.textContent = active ? '解除' : '全画面';
        document.body.style.overflow = active ? 'hidden' : '';
    }
    document.addEventListener('keydown', e => {
        if (e.key !== 'Escape') return;
        const area = document.getElementById('viewArea');
        if (area.classList.contains('is-fullscreen')) toggleFullscreen();
    });

    // ---- キーボードショートカット ----
    document.addEventListener('keydown', e => {
        if (!currentMedia || e.target.tagName === 'INPUT') return;
        switch (e.code) {
            case 'Space':
                e.preventDefault();
                currentMedia.paused ? currentMedia.play() : currentMedia.pause();
                break;
            case 'ArrowLeft':
                e.preventDefault();
                currentMedia.currentTime = Math.max(0, currentMedia.currentTime - 5);
                break;
            case 'ArrowRight':
                e.preventDefault();
                currentMedia.currentTime = Math.min(currentMedia.duration, currentMedia.currentTime + 5);
                break;
            case 'ArrowUp':
                e.preventDefault();
                currentMedia.volume = Math.min(1, currentMedia.volume + 0.1);
                document.getElementById('volumeControl').value = currentMedia.volume;
                document.getElementById('volumeValue').textContent = Math.round(currentMedia.volume * 100) + '%';
                break;
            case 'ArrowDown':
                e.preventDefault();
                currentMedia.volume = Math.max(0, currentMedia.volume - 0.1);
                document.getElementById('volumeControl').value = currentMedia.volume;
                document.getElementById('volumeValue').textContent = Math.round(currentMedia.volume * 100) + '%';
                break;
        }
    });

    updatePlaylistUI();
</script>
</body>
</html>
