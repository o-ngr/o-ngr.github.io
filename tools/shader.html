<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>シェーダー</title>
<style>
html,body{height:100%;margin:0;background:#000;color:#fff;font-family:system-ui,Segoe UI,Roboto,sans-serif}
#glcanvas{display:block;width:100vw;height:100vh}
.ui{position:fixed;left:12px;top:12px;background:rgba(0,0,0,0.45);backdrop-filter:blur(6px);padding:10px;border-radius:10px;font-size:13px}
.ui label{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.ui input[type=range]{width:160px}
.credits{position:fixed;right:12px;bottom:12px;color:#ddd;font-size:12px}
pre.shader-log{position:fixed;left:12px;bottom:12px;max-width:50vw;max-height:40vh;overflow:auto;background:#200;color:#f88;padding:8px;border-radius:6px;font-size:12px}
.small{font-size:11px;color:#ccc}
</style>
</head><body>
<canvas id="glcanvas"></canvas>
<div class="ui">
<div><label>Speed <input id="speed" type="range" min="0" max="3" step="0.01" value="1"></label></div>
<div><label>Scale <input id="scale" type="range" min="0.5" max="6" step="0.01" value="2.0"></label></div>
<div><label>Intensity <input id="intensity" type="range" min="0" max="2" step="0.01" value="1.0"></label></div>
<div><label>Quality <input id="quality" type="range" min="0.5" max="1.0" step="0.1" value="0.85"></label></div>
</div>
<div class="credits">©:made by ms0101</div>
<pre id="log" class="shader-log" style="display:none"></pre>

<script>
const canvas=document.getElementById("glcanvas");
const gl=canvas.getContext("webgl2",{antialias:true});
const logEl=document.getElementById("log");
if(!gl){document.body.innerHTML='<p style="color:red">WebGL2 is not supported in this browser.</p>';throw new Error("WebGL2 not supported");}

const vsSource=`#version 300 es
precision highp float;
out vec2 v_uv;
void main(){
const vec2 pos[3]=vec2[3](vec2(-1.,-1.),vec2(3.,-1.),vec2(-1.,3.));
vec2 p=pos[gl_VertexID];
v_uv=.5*(p+1.);
gl_Position=vec4(p,0.,1.);
}`;

const fsSource=`#version 300 es
precision highp float;
in vec2 v_uv;
out vec4 outColor;
uniform float u_time;
uniform vec2 u_resolution,u_mouse;
uniform float u_speed,u_scale,u_intensity;

mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}

float hash21(vec2 p){
p=fract(p*vec2(123.34,456.21));
p+=dot(p,p+78.233);
return fract(p.x*p.y);
}

float noise(vec2 p){
vec2 i=floor(p),f=fract(p);
float a=hash21(i),b=hash21(i+vec2(1.,0.)),c=hash21(i+vec2(0.,1.)),d=hash21(i+vec2(1.,1.));
vec2 u=f*f*(3.-2.*f);
return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);
}

float fbm(vec2 p){
float v=0.,a=.55;
for(int i=0;i<4;i++){v+=a*noise(p);p*=2.;a*=.5;}
return v;
}

vec3 palette(float t){
return .5+.5*cos(6.28318*(vec3(0.,.33,.67)+t)+vec3(0.,.2,.4));
}

void main(){
vec2 uv=v_uv;
vec2 p=(uv-.5)*vec2(u_resolution.x/u_resolution.y,1.);
float t=u_time*u_speed;
vec2 m=(u_mouse-.5)*2.;
float md=length(m);
float q=fbm(p*u_scale*.6+t*.18);
float r=fbm(p*u_scale*1.1-t*.36+vec2(q));
float f=sin((p.x+p.y)*1.8+r*2.6+t);
f+=sin(length(p+rot(t*.08)*m*.55)*2.8+t*1.25);
f*=.5+.5*fbm(p*u_scale*.85+t*.55+md*1.8);
vec3 col;
col.r=palette(f*u_intensity+r*.26+q*.18).r;
col.g=palette(f*u_intensity+r*.24+q*.2).g;
col.b=palette(f*u_intensity+r*.22+q*.22).b;
float vig=smoothstep(.9,.15,length(uv-.5));
col*=mix(.6,1.,vig);
outColor=vec4(col,1.);
}`;

function compile(t,src){
const s=gl.createShader(t);
gl.shaderSource(s,src);
gl.compileShader(s);
if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){
const log=gl.getShaderInfoLog(s);showLog("Shader compile error:\n"+log);
throw new Error(log);
}
return s;
}

function showLog(m){
logEl.style.display="block";
logEl.textContent=m;
}

try{
const vs=compile(gl.VERTEX_SHADER,vsSource);
const fs=compile(gl.FRAGMENT_SHADER,fsSource);
const program=gl.createProgram();
gl.attachShader(program,vs);
gl.attachShader(program,fs);
gl.linkProgram(program);
if(!gl.getProgramParameter(program,gl.LINK_STATUS)){
const log=gl.getProgramInfoLog(program);showLog("Program link error:\n"+log);throw new Error(log);
}
gl.useProgram(program);

const u_time=gl.getUniformLocation(program,"u_time");
const u_resolution=gl.getUniformLocation(program,"u_resolution");
const u_mouse=gl.getUniformLocation(program,"u_mouse");
const u_speed=gl.getUniformLocation(program,"u_speed");
const u_scale=gl.getUniformLocation(program,"u_scale");
const u_intensity=gl.getUniformLocation(program,"u_intensity");

const vao=gl.createVertexArray();gl.bindVertexArray(vao);

const speedEl=document.getElementById("speed");
const scaleEl=document.getElementById("scale");
const intensityEl=document.getElementById("intensity");
const qualityEl=document.getElementById("quality");

let mouse=[.5,.5];
function setMouse(x,y){
const r=canvas.getBoundingClientRect();
mouse[0]=(x-r.left)/r.width;
mouse[1]=1-(y-r.top)/r.height;
}
addEventListener("pointermove",e=>setMouse(e.clientX,e.clientY));
addEventListener("pointerdown",e=>setMouse(e.clientX,e.clientY));
addEventListener("touchmove",e=>{e.preventDefault();const t=e.touches[0];setMouse(t.clientX,t.clientY)},{passive:false});

let smSpeed=parseFloat(speedEl.value);
let smScale=parseFloat(scaleEl.value);
let smIntensity=parseFloat(intensityEl.value);
function smooth(c,t,k=.12){return c+(t-c)*k;}

const DPR_CAP=1.75;
function resize(){
const dpr=Math.min(devicePixelRatio||1,DPR_CAP);
const s=parseFloat(qualityEl.value);
const w=Math.max(1,Math.floor(innerWidth*dpr*s));
const h=Math.max(1,Math.floor(innerHeight*dpr*s));
if(canvas.width!==w||canvas.height!==h){
canvas.width=w;canvas.height=h;
canvas.style.width=innerWidth+"px";
canvas.style.height=innerHeight+"px";
gl.viewport(0,0,w,h);
}
}
addEventListener("resize",resize);
resize();

let start=performance.now();
function render(n){
resize();
const time=(n-start)*.001;
smSpeed=smooth(smSpeed,parseFloat(speedEl.value));
smScale=smooth(smScale,parseFloat(scaleEl.value));
smIntensity=smooth(smIntensity,parseFloat(intensityEl.value));
gl.viewport(0,0,canvas.width,canvas.height);
gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);
gl.useProgram(program);
gl.uniform1f(u_time,time);
gl.uniform2f(u_resolution,canvas.width,canvas.height);
gl.uniform2f(u_mouse,mouse[0],mouse[1]);
gl.uniform1f(u_speed,smSpeed);
gl.uniform1f(u_scale,smScale);
gl.uniform1f(u_intensity,smIntensity);
gl.drawArrays(gl.TRIANGLES,0,3);
requestAnimationFrame(render);
}
requestAnimationFrame(render);
}catch(e){
if(!logEl.textContent)showLog(String(e));
console.error(e);
}
</script>
</body>
</html>
