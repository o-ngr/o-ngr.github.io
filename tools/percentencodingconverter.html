<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パーセントエンコーディング変換ツール</title>
  <style>
    * {box-sizing: border-box;margin: 0;padding: 0;}
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1e1e1e;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 800px;
    }
    header {
      margin-bottom: 30px;
      text-align: center;
    }
    h1 {
      font-size: clamp(1.5rem, 5vw, 2rem);
      margin-bottom: 15px;
    }
    h1 a {
      color: #ffe500;
      text-decoration: none;
      transition: color 0.2s;
    }
    h1 a:hover {
      color: #ffe500;
    }
    .counter {
      display: inline-block;
      margin-top: 10px;
    }
    .counter img {
      max-width: 100%;
      height: auto;
    }
    main {
      background: #2b2b2b;
      border: 1px solid #555;
      border-radius: 8px;
      padding: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: #b0b0b0;
    }
    textarea {
      width: 100%;
      min-height: 120px;
      background: #1e1e1e;
      color: #e0e0e0;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 12px;
      font-size: 1rem;
      resize: vertical;
      transition: border-color 0.2s;
    }
    textarea:focus {
      outline: none;
      border-color: #ffe500;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }
    button {
      flex: 1;
      min-width: 100px;
      background: #3a3a3a;
      color: #e0e0e0;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 12px 20px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover {
      background: #505050;
      border-color: #777;
    }
    button:active {
      transform: translateY(1px);
    }
    .output-section {
      margin-top: 25px;
      padding-top: 25px;
      border-top: 1px solid #555;
    }
    .output {
      background: #1e1e1e;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 12px;
      min-height: 80px;
      word-break: break-all;
      white-space: pre-wrap;
      font-family: 'Courier New', monospace;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #3a3a3a;
      color: #e0e0e0;
      padding: 12px 24px;
      border-radius: 4px;
      border: 1px solid #555;
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
      z-index: 1000;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    @media (max-width: 600px) {
      body {padding: 15px;}
      main {padding: 15px;}
      .button-group {flex-direction: column;}
      button {min-width: 100%;}
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1><a href="/index">パーセントエンコーディング変換ツール</a></h1>
      <a href="/index" class="counter">
        <img src="https://counter.256server.com/ms0101?theme=moebooru" alt="アクセスカウンター" width="200" height="75">
      </a>
    </header>
    <main>
      <label for="inputText">テキスト入力</label>
      <textarea id="inputText" placeholder="ここにテキストを入力してください"></textarea>
      <div class="button-group">
        <button onclick="encodeText()">エンコード</button>
        <button onclick="decodeText()">デコード</button>
        <button onclick="copyText()">コピー</button>
      </div>
      <div class="output-section">
        <label>変換結果</label>
        <div class="output" id="outputText">変換結果がここに表示されます</div>
      </div>
    </main>
  </div>
  <div class="toast" id="toast"></div>
  <script>
    function encodeText() {
      const input = document.getElementById("inputText").value;
      if (!input) {
        showToast("テキストを入力してください");
        return;
      }
      const encoded = encodeURIComponent(input);
      document.getElementById("outputText").textContent = encoded;
    }
    function decodeText() {
      const input = document.getElementById("inputText").value;
      if (!input) {
        showToast("テキストを入力してください");
        return;
      }
      try {
        const decoded = decodeURIComponent(input);
        document.getElementById("outputText").textContent = decoded;
      } catch (err) {
        showToast("デコードに失敗しました");
      }
    }
    function copyText() {
      const output = document.getElementById("outputText").textContent;
      if (output === "変換結果がここに表示されます") {
        showToast("コピーする内容がありません");
        return;
      }
      navigator.clipboard.writeText(output).then(() => {
        showToast("コピーしました");
      }).catch(err => {
        showToast("コピーに失敗しました");
      });
    }
    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => {
        toast.classList.remove("show");
      }, 2000);
    }
  </script>
</body>
</html>
