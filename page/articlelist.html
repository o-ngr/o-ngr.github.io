<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Onogoro 記事一覧ページ">
  <meta property="og:title" content="Onogoro | 記事一覧">
  <meta property="og:description" content="Onogoroの公開中記事一覧です。">
  <meta property="og:type" content="website">
  <title>O-ngr | 記事一覧</title>
  
  <link rel="icon" href="/image/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@500;600;700&display=swap" rel="stylesheet">
  
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.addEventListener("contextmenu", e => e.preventDefault());
    });
  </script>
  <link rel="stylesheet" href="/index/style.css">
</head>
<body>

<!-- ═══ OVERLAY (mobile) ═══ -->
<div class="overlay" id="overlay"></div>

<!-- ═══ HEADER ═══ -->
<header class="hdr">
  <a href="/" class="logo" id="logoBtn" style="text-decoration: none; color: inherit;">Articles</a>
  <div class="search-wrap">
    <span class="search-icon">&#x2315;</span>
    <input class="search-input" id="searchInput" type="text" placeholder="記事やタグを検索... ( / でフォーカス)" autocomplete="off">
  </div>
  <div class="hdr-actions">
    <button class="hbtn icon-only" id="themeBtn" title="テーマ切替">&#x25D0;</button>
    <button class="hbtn" id="favPanelBtn" title="お気に入り">&#x2605; お気に入り</button>
  </div>
</header>

<!-- ═══ SHELL ═══ -->
<div class="shell">

  <!-- LEFT SIDEBAR -->
  <nav class="sidebar" id="sidebar">
    <span class="sidebar-label">カテゴリ / タグ</span>
    <button class="nav-btn active" data-tab="all">
      すべて <span class="nav-count" data-count="all">0</span>
    </button>
    <button class="nav-btn" data-tab="tech">
      技術・開発 <span class="nav-count" data-count="tech">0</span>
    </button>
    <button class="nav-btn" data-tab="design">
      デザイン <span class="nav-count" data-count="design">0</span>
    </button>
    <button class="nav-btn" data-tab="column">
      コラム <span class="nav-count" data-count="column">0</span>
    </button>
    <button class="nav-btn" data-tab="other">
      その他 <span class="nav-count" data-count="other">0</span>
    </button>

    <div class="sidebar-sep"></div>

    <div class="sort-wrap">
      <div class="sort-lbl">並び替え</div>
      <select class="sort-sel" id="sortSel">
        <option value="recent">新着順</option>
        <option value="oldest">古い順</option>
        <option value="title">タイトル順</option>
      </select>
    </div>
  </nav>

  <!-- MAIN -->
  <main class="main">
    <div class="main-head">
      <h1 class="main-title" id="mainTitle">すべての記事</h1>
      <span class="result-count" id="resultCount"></span>
    </div>
    <!-- 記事カードが描画されるグリッドエリア -->
    <div class="grid" id="grid"></div>
  </main>

  <!-- RIGHT PANEL (desktop) -->
  <aside class="rpanel" id="rpanel">
    <div class="rpanel-title">&#x2605; ブックマーク記事</div>
    <div class="rp-stat" id="rpStat">
      <div class="rp-stat-item">
        <span class="rp-stat-num" id="rpCount">0</span>
        <span class="rp-stat-lbl">保存数</span>
      </div>
      <div class="rp-stat-item">
        <span class="rp-stat-num" id="rpTotal">0</span>
        <span class="rp-stat-lbl">全記事数</span>
      </div>
    </div>
    <div class="fav-list" id="rpFavList"></div>
  </aside>
</div>

<!-- MOBILE FAV PANEL -->
<aside class="mpanel" id="mpanel">
  <div class="mpanel-head">
    <span class="mpanel-title">&#x2605; ブックマーク</span>
    <button class="hbtn icon-only" id="mpCloseBtn">&#x00D7;</button>
  </div>
  <div class="rp-stat" id="mpStat">
    <div class="rp-stat-item">
      <span class="rp-stat-num" id="mpCount">0</span>
      <span class="rp-stat-lbl">保存数</span>
    </div>
  </div>
  <div class="fav-list" id="mpFavList"></div>
</aside>

<!-- MOBILE BOTTOM TABS -->
<div class="mob-tabs" id="mobTabs">
  <button class="mob-tab active" data-tab="all">すべて</button>
  <button class="mob-tab" data-tab="tech">技術</button>
  <button class="mob-tab" data-tab="design">デザイン</button>
  <button class="mob-tab" data-tab="column">コラム</button>
</div>

<!-- ═══ FOOTER ═══ -->
<footer class="footer">
  <div class="footer-inner">
    <div>
      <span class="footer-logo">O-ngr</span>
      <p class="ft">記事・ブログ一覧ページ</p>
    </div>
    <div>
      <img src="https://counter.256server.com/@:ms05" alt="アクセスカウンター" width="180" height="54" style="display:block;margin-bottom:.8rem">
      <p class="ft">カウンターを使わせていただいている <a href="https://256server.com" target="_blank">256さん</a>ありがとうございます</p>
    </div>
    <div>
      <p class="ft-title">ショートカット</p>
      <p class="ft">
        / — 検索フォーカス<br>
        Esc — パネルを閉じる
      </p>
    </div>
    <div>
      <p class="ft-title">情報</p>
      <p class="ft">
        <a href="/info/privacypolicy.html">プライバシーポリシー</a><br>
        <a href="/info/termsofuse.html">利用規約</a>
      </p>
    </div>
    <div>
      <p class="ft-title">Copyright</p>
      <p class="ft">
        &copy; 2025 o-ngr — <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank">CC BY-NC-SA 4.0</a>
      </p>
    </div>
  </div>
</footer>
  
<script src="/page/articles.js"></script>
<script src="/index/script.js"></script>
</body>
</html>
