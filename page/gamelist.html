<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オノゴロ | ゲームコレクション</title>
  <link rel="stylesheet" href="/page/list.css">
  <!-- Google Fonts: Inter & Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>
<body>

<!-- Navigation -->
<header class="nav-header">
  <div class="nav-container">
    <a href="/" class="brand-logo">
      <span class="logo-mark">O</span>
      <span class="logo-text">オノゴロ</span>
    </a>
    <div class="nav-actions">
      <a href="/" class="counter-badge" title="アクセスカウンター">
        <img src="https://counter.256server.com/@:ms05" alt="Counter" class="counter-img">
      </a>
    </div>
  </div>
</header>

<main class="main-content">

  <!-- Hero Header -->
  <section class="hero-section">
    <div class="hero-text">
      <h1 class="hero-title">ゲームコレクション</h1>
      <p class="hero-subtitle">暇つぶしに最適なミニゲームと便利なツール群</p>
    </div>
  </section>

  <!-- Controls Bar (Search + Tabs) -->
  <section class="controls-section">
    <div class="search-bar">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="searchInput" class="search-input" placeholder="ゲームやツールを検索... (Ctrl + K)">
      <span class="search-shortcut">⌘K</span>
    </div>

    <div class="filter-controls">
      <div class="tab-segment">
        <button class="tab-btn active" data-filter="all">すべて</button>
        <button class="tab-btn" data-filter="favorites">
          <span class="star-icon">★</span> お気に入り
        </button>
      </div>
      <div class="tag-chips" id="tagChips">
        <!-- JSでタグが自動生成されます -->
      </div>
    </div>
  </section>

  <!-- Stats Bar -->
  <div class="stats-bar">
    <div class="stat-item">
      <span class="stat-number" id="totalCount">0</span>
      <span class="stat-label">アイテム</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat-item">
      <span class="stat-number" id="favCount">0</span>
      <span class="stat-label">お気に入り</span>
    </div>
  </div>

  <!-- Favorites Quick Bar -->
  <section class="fav-section hidden" id="favSection">
    <h2 class="section-heading">お気に入りクイックアクセス</h2>
    <div class="fav-grid" id="favList"></div>
  </section>

  <!-- Main Tools Grid -->
  <section class="grid-section">
    <h2 class="section-heading" id="mainLabel">すべてのコレクション</h2>
    <div class="tools-grid" id="toolsGrid">
      <div class="loading-state">
        <div class="spinner"></div>
        <p>コンテンツを読み込み中...</p>
      </div>
    </div>
  </section>

</main>

<script>
const TOOLS_JSON_PATH = '/page/games.json'; 
let TOOLS = [];
let favorites = [];
let currentFilter = 'all';
let selectedTag = null;
let searchQuery = '';

/* OS Theme Listener */
const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
localStorage.removeItem('theme');

/* Favorites Storage */
function loadFavorites() {
  try {
    favorites = JSON.parse(localStorage.getItem('toolFavorites') || '[]');
  } catch(e) {
    favorites = [];
  }
}

function saveFavorites() {
  localStorage.setItem('toolFavorites', JSON.stringify(favorites));
}

function toggleFavorite(id) {
  const i = favorites.indexOf(id);
  if (i > -1) favorites.splice(i, 1);
  else favorites.push(id);
  saveFavorites();
  render();
}

/* Load JSON */
async function loadTools() {
  try {
    const res = await fetch(TOOLS_JSON_PATH, { cache: 'no-store' });
    if (!res.ok) throw new Error('データ取得エラー');
    TOOLS = await res.json();
    renderTags();
  } catch (err) {
    console.error(err);
    document.getElementById('toolsGrid').innerHTML = `
      <div class="empty-state">
        <p class="empty-title">データを読み込めませんでした</p>
        <p class="empty-desc">ネットワーク接続またはファイルパスを確認してください</p>
      </div>`;
    return;
  }
  render();
}

/* Dynamic Tags */
function renderTags() {
  const tagSet = new Set();
  TOOLS.forEach(t => t.tags.forEach(tag => tagSet.add(tag)));
  const tagChips = document.getElementById('tagChips');
  
  tagChips.innerHTML = Array.from(tagSet).map(tag => `
    <button class="chip-btn" data-tag="${tag}">#${tag}</button>
  `).join('');

  tagChips.querySelectorAll('.chip-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      const tag = e.currentTarget.dataset.tag;
      if (selectedTag === tag) {
        selectedTag = null;
        e.currentTarget.classList.remove('active');
      } else {
        tagChips.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active'));
        selectedTag = tag;
        e.currentTarget.classList.add('active');
      }
      render();
    });
  });
}

/* Filter Logic */
function getFiltered() {
  let list = TOOLS;

  if (currentFilter === 'favorites') {
    list = list.filter(t => favorites.includes(t.id));
  }

  if (selectedTag) {
    list = list.filter(t => t.tags.includes(selectedTag));
  }

  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter(t =>
      t.name.toLowerCase().includes(q) ||
      t.desc.toLowerCase().includes(q) ||
      t.tags.some(tag => tag.toLowerCase().includes(q))
    );
  }
  return list;
}

/* Render UI */
function renderFavSection() {
  const favItems = TOOLS.filter(t => favorites.includes(t.id));
  const section = document.getElementById('favSection');
  const list = document.getElementById('favList');

  if (favItems.length === 0 || currentFilter === 'favorites') {
    section.classList.add('hidden');
    return;
  }
  section.classList.remove('hidden');

  list.innerHTML = favItems.map(t => `
    <div class="fav-card" data-url="${t.url}" tabindex="0">
      <div class="fav-card-content">
        <span class="fav-title">${t.name}</span>
      </div>
      <button class="fav-remove-btn" data-id="${t.id}" title="お気に入りを解除">✕</button>
    </div>
  `).join('');
}

function renderToolsGrid() {
  const filtered = getFiltered();
  const grid = document.getElementById('toolsGrid');
  const label = document.getElementById('mainLabel');

  if (currentFilter === 'favorites') {
    label.textContent = 'お気に入りリスト';
  } else if (searchQuery || selectedTag) {
    label.textContent = '検索結果';
  } else {
    label.textContent = 'すべてのコレクション';
  }

  if (filtered.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <p class="empty-title">該当するコンテンツがありません</p>
        <p class="empty-desc">検索ワードやフィルター条件を変更してみてください</p>
      </div>`;
    return;
  }

  grid.innerHTML = filtered.map(t => {
    const isFav = favorites.includes(t.id);
    const tags = t.tags.map(tag => `<span class="tag-badge">#${tag}</span>`).join('');
    return `
      <article class="tool-card" data-url="${t.url}" tabindex="0">
        <div class="card-header">
          <h3 class="card-title">${t.name}</h3>
          <button class="fav-btn ${isFav ? 'active' : ''}" data-id="${t.id}" title="${isFav ? 'お気に入り解除' : 'お気に入り追加'}">
            ${isFav ? '★' : '☆'}
          </button>
        </div>
        <p class="card-desc">${t.desc}</p>
        <div class="card-footer">
          <div class="card-tags">${tags}</div>
          <span class="card-arrow">→</span>
        </div>
      </article>
    `;
  }).join('');
}

function renderStats() {
  const favCount = TOOLS.filter(t => favorites.includes(t.id)).length;
  const filtered = getFiltered();
  document.getElementById('totalCount').textContent = filtered.length;
  document.getElementById('favCount').textContent = favCount;
}

function render() {
  renderFavSection();
  renderToolsGrid();
  renderStats();
}

/* Event Listeners */
document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  render();
});

// Shortcut Ctrl+K / Cmd+K
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
});

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', e => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    e.currentTarget.classList.add('active');
    currentFilter = e.currentTarget.dataset.filter;
    render();
  });
});

document.addEventListener('click', e => {
  const favBtn = e.target.closest('.fav-btn');
  if (favBtn) {
    e.preventDefault();
    toggleFavorite(parseInt(favBtn.dataset.id));
    return;
  }
  const removeBtn = e.target.closest('.fav-remove-btn');
  if (removeBtn) {
    e.preventDefault();
    toggleFavorite(parseInt(removeBtn.dataset.id));
    return;
  }
  const card = e.target.closest('.tool-card, .fav-card');
  if (card && card.dataset.url) {
    window.location.href = card.dataset.url;
  }
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.closest('.fav-btn') || e.target.closest('.fav-remove-btn')) return;
  const card = e.target.closest('.tool-card, .fav-card');
  if (card && card.dataset.url) {
    window.location.href = card.dataset.url;
  }
});

/* Init */
loadFavorites();
loadTools();
</script>
</body>
</html>
